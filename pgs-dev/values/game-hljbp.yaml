game:
  hljbp:
    id: 2009
    name: 歡樂聚寶盆
    group: poker
    room:
      - serverid: 200900410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2009				                                            // 遊戲ID
            gamename=歡樂聚寶盆                                             // 遊戲名稱
            flag=41			     	                                            // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=2                                                   // 遊戲最小人數
            maxplayer=8                                                   // 遊戲最大人數
            tablecount=100			                                          // 桌子數
            seatcount=8				                                            // 椅子數
            loginmoney=100000			                                          // 進入遊戲最小積分
            scoremode=0					                                          // 0 即時寫分 1退房間寫分
            maxuser=500					                                          // 最大人數
            taxscale=5					                                          // 抽水比例
            readywaittime=6				                                        // 舉手超時時間,單位秒
            reghallserverinterval=60	                                    // 註冊廣場時間間隔,單位秒
            basescore=100			                                            // 底分
            pokertype=1					                                          // 1隨機發牌 2 發牌器發牌
            deallog=2					                                            // 牌局記錄器類型0 不記錄 ,1 文本, 2 db
            maxgamecountsametable=0		                                    // 同一桌最大遊戲次數
            matchmakingtime=0                                             // 滿遊戲最小人數的等待時間
            matchmakingnumber=0                                           // 開始倒數時間的最低人數
            gametimeout=10                                                // 當遊戲開始後超過N分鐘未結束該局就踢出此張桌子所有人
            kickoutmoney=0			                                          // 達到此积分，強制退出房間
            syspoolmode=2               //系統水池模式 0:無水池, 1:單機模式, 2:資料庫模式
            syspoolctrlrate=100          //系統水池，開系統有利獎的機率
            winline=150000000             //贏錢線

            [gamequeue]
            gamematchwaitmintime=1		                                    // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3		                                    // 撮合時間間隔範圍大值,單位秒
            againstsameip=0				                                        // 同IP不分配一起
            againstlastgame=0			                                        // 最後一次遊戲過的用戶不分配一起
            gameendaction=0				                                        // 遊戲結束後動作,0 無動作 1 準備
            queuetype=0					                                          // 撮合類型 0 時間隨機 1 固定人數 2輸贏對戰
            queueusercount=3			                                        // 排隊人數
            queuetimeout=3				                                        // 排隊人數超時
            lessthanuser=10				                                        // 低於幾人不採用分桌機制

            [robot]
            enable=1									                                    // 是否開啟機器人
            logoninterval=30								                              // 加載機器人時間間隔
            minmneyamount=100000							                              // 機器人最小金幣數
            maxmoneyamount=60000000						                              // 機器人最大金幣數
            queuecheckwaitspan=3,5							                          // 配桌檢查時間間隔
            queueagainwaitspan=3,5							                          // 繼續配桌時間間隔
            tablemaxusercount=8								                            // 配桌時桌子上最大人數
            tableminusercount=1								                            // 配桌時桌子上最小人數
            gameendleaveodds=1							                              // 遊戲結束時離開遊戲機率
            autositwaitspan=1,3							                              // 主動入座時間間隔
            gameactionwaitspan=1,2							                          // 遊戲動作響應時間間隔
            gamereadywaitspan=1,5							                            // 遊戲準備相應時間間隔
            maxusergameendleaveodds=0						                          // 人數達到上限時離開遊戲機率
            maxcardsrndlvl=1								                              // 機器人換牌概率0-10
            againstgameing=0                                              // 進入正在遊戲中的(觀戰) 0是 1否
            matchtablemode=0                                              // 配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人
            tablematchrobotrate=1,0|2,40|3,33|4,27                        // 為機器人人數,20機率%. 桌子隨機配N個機器人.分母為固定值,所有數字總和需為100
            stresstest=0

            [GameSetting]
            TimeoutBetting=10                                             // 下注時間
            TimeoutSettlement=15                                          // 結算時間
            ChipValue=50000,100000,200000,500000,1000000                            // 籌碼面額
            BetLimit=2000000                                                // 押注限額
            KickUserRound=5				                                        // 多少回合沒下注將玩家踢出遊戲，單位回合

          robot.dat: |
            [csize]
            cn=1

            // 預設機器人
            [c1]
            BetRate=10000                                                 // 下注機率 ,100 是為1%
            BetRange=1,7,2                                                // 底注下注範圍,bet_range,1-7(籌碼編號),2(數量)
            MoneyTime=200,1000	        	                                // 下注間隔時間 200,1000 為200-1000毫秒隨機
