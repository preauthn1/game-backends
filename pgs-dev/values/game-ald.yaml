game:
  ald:
    id: 1025
    name: 阿拉丁
    group: slot
    room:
      - port: 13401
        serverid: 102500410
        proto: ald
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=1025				 	                              // 遊戲ID
            gamename=阿拉丁  		 	                            // 遊戲名稱
            flag=41                                           // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=1                                       // 遊戲最小人數
            maxplayer=1                                       // 遊戲最大人數
            tablecount=480                                    // 桌子數
            seatcount=1                                       // 椅子數
            loginmoney=0                                      // 進入遊戲最小積分
            scoremode=0                                       // 0 即時寫分 1 退房間寫分 2 比賽 3 分段寫分
            maxuser=480                                       // 最大人數
            taxscale=0                                        // 抽水比例
            readywaittime=10                                  // 舉手超時時間,單位秒
            reghallserverinterval=5                           // 註冊廣場時間間隔,單位秒
            basescore=100                                     // 底分
            deallog=2                                         // 牌局記錄器類型 0 不記錄 ,1 文本, 2 db, 3 fish, 4分段寫分
            mincarrymoney=0                                   // 下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1                            // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3                            // 撮合時間間隔範圍大值,單位秒
            againstsameip=0                                   // 同IP不分配一起
            againstlastgame=0                                 // 最後一次遊戲過的用戶不分配一起
            gameendaction=0                                   // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1                                       // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=1                                  // 排隊人數
            queuetimeout=2                                    // 排隊人數超時

            [robot]
            enable=1										                      // 是否開啟機器人
            logoninterval=30								                  // 加載機器人時間間隔
            minmneyamount=100000							                // 機器人最小金幣數
            maxmoneyamount=500000000						              // 機器人最大金幣數
            queuecheckwaitspan=5,10							              // 配桌檢查時間間隔
            queueagainwaitspan=3,5							              // 繼續配桌時間間隔
            tablemaxusercount=1							                  // 配桌時桌子上最大人數
            tableminusercount=0								                // 配桌時桌子上最小人數
            gameendleaveodds=0							                // 遊戲結束時離開遊戲機率
            autositwaitspan=10,15							                // 主動入座時間間隔
            gameactionwaitspan=2,5							              // 遊戲動作響應時間間隔
            gamereadywaitspan=3,5							                // 遊戲準備相應時間間隔
            maxusergameendleaveodds=0						              // 人數達到上限時離開遊戲機率
            maxcardsrndlvl=0								                  // 機器人換牌概率0-10
            stresstest=1
            
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				                            // 結算動畫超時
            betcount=10,20,30,50,70,100,200,300,500,700,1000  // 一次下注的數量

            slotpattern=3                                     // 參考csv SlotPattern類型, 可多個用逗號分
            releasepattern=3                                  // 放分
            bitepattern=3                                     // 咬分
            bigwinrule=25,75,150,250   								        // client動畫播放階段,以Bet為主
            bigwinnotify=25                                   // 當下注16, Total=6400(16*400) 得獎超過6400才廣播.

            [symbols]
            w1.title=百搭
            w1.desc=可代表任何符號，只出現在第2、3、4轉軸。 \n符號擴展佔據整個轉軸，並觸發免費再轉\n免費再轉最多觸發3次

            [description]
            payline.desc=遊戲有10條賠付線，轉軸上由最左至右或由最右至左連續出現3個以上的相同符號，即可​​獲得該圖標的得分獎勵！ \n只賠付每條線中贏取最高的獎金。 \n遊戲出現故障時，所有賠付和遊戲都視為無效。
