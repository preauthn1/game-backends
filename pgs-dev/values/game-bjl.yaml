game:
  bjl:
    id: 2130
    name: 百家樂
    group: poker
    room:
      - serverid: 213000410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2130				 			                                // 遊戲ID
            gamename=百家樂			 			                               // 遊戲名稱
            flag=41				     		                              	  // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=1              			                          // 遊戲最小人數
            maxplayer=500            			                          // 遊戲最大人數
            tablecount=1			 			                                // 桌子数
            seatcount=500						                                // 椅子数
            loginmoney=0			 			                                // 進入遊戲最小積分
            scoremode=0							                                // 0 即時寫分 1退房間寫分
            maxuser=500							                                // 最大人數
            taxscale=5							                                // 抽水比例
            readywaittime=30					                              // 舉手超時時間,單位秒
            reghallserverinterval=5			                            // 註冊廣場時間間隔,單位秒
            qiangzhuang=100						                              // 搶莊時間，單位秒
            bettime=18							                                // 下注時間
            basescore=100						                                // 底分
            kaijiangactiontime=12				                            // 開獎動畫超時
            endactiontime=3					                                // 結算動畫超時
            zhuanglimit=500000						                          // 上莊資金限制
            zhuangturn=8						                                // 莊局數
            betcount=10000,50000,100000,500000,1000000,5000000,10000000           // 一次下注的數量
            maxclearcount=1						                              // 最大清除次數
            maxrobotzhuang=5			                                  // 最多多少個機器人上莊
            robotxiazhuang=30			                                  // 機器人下莊概率百分比
            robotzhuang=100				                                  // 沒有人當莊的時候機器人當莊的概率百分比
            winline=1500000				                                        // 機器人贏錢線
            zhushui=0                                               // 注水比例
            betamode=0					                                    // 是否開啟測試中程式 0:close, 1:open
            deallog=2                                               // 牌局記錄器類型 0 不記錄 1 文本 2 db 
            single=1					                                      // 單間房是否可直接入場 0:不可 1：可
            betlimitmoney=5000			                                  // 下注攜帶金額限制
            publiczhuang=0                                          // 是否開放用戶上莊 0:close, 1:open
            luckystarround=5                                        // 幸運星持續局數
            syspoolmode=2               //系統水池模式 0:無水池, 1:單機模式, 2:資料庫模式

            [robot]
            enable=1										                            // 是否開啟機器人
            logoninterval=30								                        // 加載機器人時間間隔
            minmneyamount=5000000								                    // 機器人最小金幣數
            maxmoneyamount=10000000						                      // 機器人最大金幣數
            queuecheckwaitspan=5,10					                    		// 配桌檢查時間間隔
            queueagainwaitspan=3,5					                    		// 繼續配桌時間間隔
            tablemaxusercount=500							                      // 配桌時桌子上最大人數
            tableminusercount=0								                      // 配桌時桌子上最小人數
            gameendleaveodds=0.5							                      // 遊戲結束時離開遊戲機率
            autositwaitspan=1,3							                        // 主動入座時間間隔
            gameactionwaitspan=1,4							                    // 遊戲動作響應時間間隔
            gamereadywaitspan=3,5							                      // 遊戲準備響應時間間隔
            maxusergameendleaveodds=1						                    // 人數達到上限時離開遊戲機率
            maxcardsrndlvl=1								                        // 機器人換牌概率值
            matchtablemode=0                                        // 配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人 2固定配機器人可配置上限
            tablematchrobotrate=60,100                              // 為機器人人數,100機率%. 桌子隨機配N個機器人. 機率要設滿100%

            [gamequeue]
            gamematchwaitmintime=1		                              // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=2		                              // 撮合時間間隔範圍大值,單位秒
            againstsameip=0				                                  // 同IP不分配一起
            againstlastgame=0			                                  // 最後一次遊戲過的用戶不分配一起
            gameendaction=0				                                  // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1					                                    // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=1			                                  // 排隊人數
            queuetimeout=2				                                  // 排隊人數超時

            [baijiale]
            count=10
            1=8,2,1,100000000					                              // 莊 // 1類型，8概率，2倍率，100一次下注的錢,100000000下注限制，此概率為莊閒和的概率。 8/17
            2=8,2,1,100000000					                              // 閒
            3=1,9,1,125000000						                              // 和
            4=0,4,0,15000000						                              // 莊天王，從這裡開始是概率為千分比
            5=0,4,0,15000000						                              // 閒天王
            6=70,12,1,9000000					                              // 莊對
            7=70,12,1,9000000					                              // 閒對
            8=0,56,0,150000						                              // 莊順
            9=0,56,0,150000						                              // 閒順
            10=0,34,0,300000						                              // 同點和

            [poolline]
            count=5
            1=0,100     //1水線順序, 0水池低於時, 100系统找出有利奖项的机率
            2=100000000,100
            3=120000000,100
            4=140000000,100
            5=150000000,100
          robot.dat: |
            [csize]
            cn=8

            // 偏執的偏莊機器人
            [c1]
            betcount=25,25000                                         // 一次下注的數量
            bettype=1                                               // 下注類型

            // 偏執的偏閒機器人
            [c2]
            betcount=25,25000                                         // 一次下注的數量
            bettype=2                                               // 下注類型

            // 貪心的機器人
            [c3]
            betcount=25,10000                                         // 一次下注的數量
            bettype=1,2                                             // 下注類型

            // 冷靜的偏莊機器人
            [c4]
            betcount=250,50000                                        // 一次下注的數量
            bettype=1                                               // 下注類型

            // 冷靜的偏閒機器人
            [c5]
            betcount=250,50000                                        // 一次下注的數量
            bettype=2                                               // 下注類型

            // 冷靜的偏和機器人
            [c6]
            betcount=5,1000                                           // 一次下注的數量
            bettype=3                                               // 下注類型

            // 碰碰運氣的機器人
            [c7]
            betcount=5,500                                            // 一次下注的數量
            bettype=6,7                                             // 下注類型

            // 貪心的機器人
            [c8]
            betcount=5,1000                                          // 一次下注的數量
            bettype=3,6,7                                           // 下注類型
