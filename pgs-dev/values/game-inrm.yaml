game:
  inrm:
    id: 2220
    name: 印度拉米
    group: poker
    room:
      - serverid: 222000410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2220				 	            // 遊戲ID
            gamename=印度拉米                // 遊戲名稱
            flag=41				     	            // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=2                     // 遊戲最小人數
            maxplayer=5          		        // 遊戲最大人數
            tablecount=5			 	            // 桌子數
            seatcount=5		    		          // 椅子數
            loginmoney=4000			 	          // 進入遊戲最小金幣，不足會被踢
            scoremode=0					            // 0 即時寫分 1退房間寫分
            maxuser=480					            // 最大人數
            taxscale=5					            // 稅率
            readywaittime=10			          // 準備超時時間,單位秒
            reghallserverinterval=5	        // 註冊廣場時間間隔,單位秒
            basescore=50				            // 底分
            deallog=2					              // 牌局記錄器類型 0: 不記錄 ,1: 文本, 2: db, 3: 捕魚, 4: 條件紀錄, 5: Console
            startwaittime=10s               // 倒數等待開始時間 Default: 10s
            actionwaittime=30s              // 每次動作等待時間 Default: 15s
            scoerperpoint=50                // 每一點使用的分數 Default: 50
            handcardlehgth=13               // 手牌張數 Default: 13
            maxpoint=80                     // 最大失敗點數 Default: 80
            giveuppoint=40                  // 棄牌點數 Default: 40
            misslimit=3                     // 最大失誤次數 Default: 3
            shuffletimes=3                  // 每局洗牌次數 Default: 3
            usepokernum=2                   // 使用幾副牌 Default: 2

            [gamequeue]
            gamematchwaitmintime=1		      // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3		      // 撮合時間間隔範圍大值,單位秒
            againstsameip=0				          // 同IP不分配一起
            againstlastgame=0			          // 最後一次遊戲過的用戶不分配一起
            gameendaction=0				          // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1					            // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=2			          // 排隊人數
            queuetimeout=2				          // 排隊人數超時
            disableentergamingtable=1       // 限制進入遊戲中牌桌 (true: 不可以進，false: 可以進) Default: false

            [robot]
            enable=1										    // 是否開啟機器人
            logoninterval=30								// 加載機器人時間間隔
            minmneyamount=5000							// 機器人最小金幣數
            maxmoneyamount=10000000					// 機器人最大金幣數
            queuecheckwaitspan=5,10					// 配桌檢查時間間隔
            queueagainwaitspan=3,5					// 繼續配桌時間間隔
            tablemaxusercount=5						  // 配桌時桌子上最大人數
            tableminusercount=1							// 配桌時桌子上最小人數
            gameendleaveodds=0							// 遊戲結束時離開遊戲機率
            autositwaitspan=1,3							// 主動入座時間間隔
            gameactionwaitspan=1,1					// 遊戲動作響應時間間隔
            gamereadywaitspan=3,5						// 遊戲準備響應時間間隔
            maxusergameendleaveodds=1				// 人數達到上限時離開遊戲機率
            matchtablemode=0                // 配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人 2固定配機器人可配置上限
            tablematchrobotrate=60,100      // 為機器人人數,100機率%. 桌子隨機配N個機器人. 機率要設滿100%
