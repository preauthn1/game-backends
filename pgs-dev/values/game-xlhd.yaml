game:
  xlhd:
    id: 2230
    name: 新龍虎鬥
    group: poker
    admin: true
    room:
      - serverid: 223000410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2230			                                          	 	// 遊戲ID
            gamename=新龍虎鬥(2023)                                        // 遊戲名稱
            flag=41				                                               	// 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=1                                                   // 遊戲最小人數
            maxplayer=480                                                 // 遊戲最大人數
            tablecount=1		                                          	 	// 桌子數
            seatcount=480		                                          		// 椅子數
            loginmoney=0		                                          	 	// 進入遊戲最小積分
            scoremode=0			                                          		// 0 即時寫分 1退房間寫分
            maxuser=480			                                          		// 最大人數
            taxscale=3			                                          		// 抽水比例
            readywaittime=10			                                        // 舉手超時時間,單位秒
            reghallserverinterval=5		                                    // 註冊廣場時間間隔,單位秒
            bettime=16					                                          // 下注時間
            basescore=100				                                          // 底分
            kaijiangactiontime=5		                                      // 開獎動畫超時
            endactiontime=3				                                        // 結算動畫超時
            zhuanglimit=500000			                                      // 上莊資金限制
            zhuangturn=6				                                          // 上莊局數
            betcount=500,1000,2000,5000,10000,15000,30000,                // 一次下注的數量
            maxclearcount=1				                                        // 最大清除次數
            deallog=2					                                            // 牌局記錄器類型 0 不記錄 1 文本 2 db
            zhushui=0                 	                                  // 注水比例
            maxrobotzhuang=5			                                        // 最多多少個機器人上莊
            robotxiazhuang=20			                                        // 機器人下莊概率百分比
            robotzhuang=100				                                        // 沒有人當莊的時候機器人當莊的概率百分比
            winline=1500000                                               // 機器人贏錢線
            single=1					                                            // 單間房是否可直接入場 0:不可 1：可
            betlimitmoney=50			                                        // 下注攜帶金額限制
            publiczhuang=0                                                // 是否開放用戶上莊 0:close, 1:open
            luckystarround=5                                              // 幸運星持續局數
            HEandKill=1                                                   // 0:開和通殺 1:開和全退 2:開和殺一半
            syspoolmode=2                                                 // 系統水池模式 0:無水池, 1:單機模式, 2:資料庫模式
            syspoolctrlrate=50                                            // 系統水池，開系統有利獎的機率
            syspooldeducttax=1                                            //系統水池吃稅: 0: 不吃稅, 1: 吃稅 Default: 0
            syspoolautodeductrate=1                                       //系統水池吃水比例 Default: 0
            usermaxbet=30000                                              // 單人下注限制(分) Default: 100000
            flowtype=1                                                    // 流水統計方式 0: 輸分流水 1: 有效投注流水 Default: 0

            [jackpot]
            enabled=1					          // 是否開啟獎池 Default: false
            awardpause=0                // 暫停出獎 Default: false
            basepool=500000			        // 獎池基數(分)，重置後金額 Default: 50000
            contribute=20              // 獎池貢獻比例萬分比 Default: 200
            awardpool=1000000           // 獎池獎勵基數(分)，到達時可以派獎 Default: 1000000
            phaselevel=10,30,60         // 獎池動態階段(分)，0-10% Phase1, 10%-30% Phase2, 30%-60% Phase3, 60%-100% Phase4 Default: 10,30,60
            award_weight_none=19993     // None獎池(沒中) 獎勵權重 19993/20000 Default: 19993
            award_weight_mini=4         // Mini獎池 獎勵權重 4/20000 Default: 4
            award_weight_minor=2        // Minor獎池 獎勵權重 2/20000 Default: 2
            award_weight_grand=1        // Grand獎池 獎勵權重 1/20000 Default: 1
            award_amount_mini=20000    // Mini獎池 獎勵金額(分) Default: 20000
            award_amount_minor=100000   // Minor獎池 獎勵金額(分) Default: 100000
            allowed_bet_mini=0          // Mini獎池 下注n允許獲得 Mini獎池獎勵 Default: 0
            allowed_bet_minor=2000        // Minor獎池 下注n允許獲得 Minor獎池獎勵 Default: 20
            allowed_bet_grand=10000       // Grand獎池 下注n允許獲得 Grand獎池獎勵 Default: 100

            [gamequeue]
            gamematchwaitmintime=1		                                    // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3		                                    // 撮合時間間隔範圍大值,單位秒
            againstsameip=0				                                        // 同IP不分配一起
            againstlastgame=0			                                        // 最後一次遊戲過的用戶不分配一起
            gameendaction=0				                                        // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1					                                          // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=1			                                        // 排隊人數
            queuetimeout=2				                                        // 排隊人數超時

            [robot]
            enable=1										                                  // 是否開啟機器人
            logoninterval=30								                              // 加載機器人時間間隔
            minmneyamount=500000								                          // 機器人最小金幣數
            maxmoneyamount=5000000						                            // 機器人最大金幣數
            queuecheckwaitspan=5,10							                          // 配桌檢查時間間隔
            queueagainwaitspan=3,5							                          // 繼續配桌時間間隔
            tablemaxusercount=480							                            // 配桌時桌子上最大人數
            tableminusercount=0								                            // 配桌時桌子上最小人數
            gameendleaveodds=0.5							                            // 遊戲結束時離開遊戲機率
            maxusergameendleaveodds=1						                          // 人數達到上限時離開遊戲機率
            autositwaitspan=1,3							                              // 主動入座時間間隔
            gameactionwaitspan=1,5						                            // 遊戲動作響應時間間隔
            gamereadywaitspan=3,5							                            // 遊戲準備相應時間間隔
            maxcardsrndlvl=1								                              // 機器人換牌概率值
            matchtablemode=0                                              // 配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人 2固定配機器人可配置上限
            tablematchrobotrate=50,100                                    // 為機器人人數,100機率%. 桌子隨機配N個機器人. 機率要設滿100%

            [longhudou]
            count=3
            1=2,1,10000000                                                // 1類型=倍率,下注翻倍倍率,區域下注限制
            2=9,1,10000000
            3=2,1,10000000  
            
            [supertool]
            ctrlbetlimit=1000                                             // 監控名單會控制的最低注額(分)

          robot.dat: |
            [csize]
            cn=6

            // 正常機器人
            [c1]
            betcount=15,15                                                // 一次下注的數量隨機
            bettype=1,3                                                   // 下注類型
            line=200                                                    // 龍，虎平衡線

            // 正常機器人
            [c2]
            betcount=35,35                                              // 一次下注的數量隨機
            bettype=1,3                                                   // 下注類型
            line=200                                                    // 龍，虎平衡線

            // 補差機器人1
            [c3]
            betcount=5,5                                              // 一次下注的數量隨機
            bettype=1,3                                                   // 下注類型
            line=200                                                    // 龍，虎平衡線

            // 補差機器人2
            [c4]
            betcount=85,85                                              // 一次下注的數量隨機
            bettype=1,3                                                   // 下注類型
            line=200                                                    // 龍，虎平衡線

            // 和機器人
            [c5]
            betcount=5,5                                                 // 一次下注的數量隨機
            bettype=1,3,1,3,1,3,2                                                     // 下注類型
            line=200                                                     // 龍，虎平衡線

            // 補差機器人2
            [c6]
            betcount=5,5                                                  // 一次下注的數量隨機
            bettype=1,3                                                   // 下注類型
            line=200                                                     // 龍，虎平衡線
