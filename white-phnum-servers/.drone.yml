debug: true
workspace:
  base: /go
  path: /src/example.invalid/ServerTeam/Servers
pipeline:
  go-test:
    group: test
    image: golang:1.12
    environment:
      GO111MODULE: "on"
      GOPROXY: http://0.0.0.0:3000
    volumes:
      - /go/pkg/mod:/go/pkg/mod
    commands: 
      - mkdir -p .cover
      - go test ./pkg/slot -coverprofile=.cover/pkg.slot.cover
      - go test ./pkg/slot/baselogic -coverprofile=.cover/pkg.slot.baselogic.cover
      - go test ./pkg/slot/dbhandler -coverprofile=.cover/pkg.slot.dbhandler.cover
      - go test ./pkg/slot/dbhandler/service -coverprofile=.cover/pkg.slot.dbhandler.service.cover
      - make test-game-dfdc
      - make test-game-tgw
      - make test-game-ald
      - make test-game-wlzb
      - make test-game-xmbx
    when:
      branch: [ develop, release/*, feature/*, bugfix/*, hotfix/* ]
      event: [ pull_request, merge_request ]

  build-init:
    image: golang:1.12
    commands:
      - date=$(TZ=Asia/Taipei date +%Y%m%d)
      - build_name=$date-phnum-$DRONE_BUILD_NUMBER
      - release_folder=./release/$build_name
      - mkdir -p $release_folder
      - cp -rf .cover $release_folder/cover
      - GIT_HASH=`git rev-parse --short HEAD`
      - BUILD_TIME=`TZ=Asia/Taipei date +%FT%T%z`
      - BUILD_NUM=`basename $release_folder`
      - cd $release_folder
      - echo "GitTag=$DRONE_TAG" > version.txt
      - echo "BuildTime=$BUILD_TIME" >> version.txt
      - echo "GitHash=$GIT_HASH" >> version.txt
      - echo "BuildNum=$BUILD_NUM" >> version.txt
      - cat version.txt
    when:
      event: [ tag ]

  build-linux:
    group: build
    image: golang:1.12
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
      GO111MODULE: "on"
      GOPROXY: http://0.0.0.0:3000
    volumes:
      - /go/pkg/mod:/go/pkg/mod
    commands:
      - make build-main
      - make build-game
    when:
      event: [ tag ]

  copy-to-release:
    group: release
    image: target/drone-copy
    srcdir: release/*
    destdir: /mnt/release/
    volumes:
      - /mnt/release:/mnt/release
    when:
      event: [ tag ]