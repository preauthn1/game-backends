syntax = "proto2";

package netproto;

// 游客登录
message GuestLogin {
    required string HDCode = 1;      // 设备码
    required int32 HDType = 2;       // 设备类型
    required int32 SiteID = 3;       // 渠道ID
    required string Version = 4;     // 客户端版本号
    required int32 PlatformID = 5;   // 平台号
    optional int32 ServerID = 6;     // 服务器ID
    optional string InviteCode = 7;  // 邀請碼
    optional string GuestKey = 8;    // check key
    optional int32 Area_ID = 9;      // 渠道ID
};

// 用户登录
message UserLogin {
    required string HDCode = 1;     // 设备码
    required int32 HDType = 2;      // 设备类型
    required int32 SiteID = 3;      // 渠道ID
    required string Version = 4;    // 客户端版本号
    required int32 PlatformID = 5;  // 平台号
    optional string LoginName = 6;  // 用户名
    optional string Password = 7;   // 密码
    optional int32 UserID = 8;      // 用户ID
    optional string Cer = 9;        // 证书
    optional int32 Area_ID = 10;    // 渠道ID
};

// 用户登录结果
message UserLoginRet {
    required int32 Code = 1;                  // 登录结果代码
    required string Message = 2;              // 提示消息
    optional int32 UserID = 3;                // 用户ID
    optional string Cer = 4;                  // 用户证书
    optional string HDCode = 5;               // 设备码
    optional int32 HDType = 6;                // 设备类型
    optional UserHallLogonData UserData = 7;  // 用户数据
    optional int32 Area_ID = 8;               // 渠道ID
    optional FlowAmountInfo FlowInfo = 9;     // 充值返利活動
};

// 充值返利活動
message FlowAmountInfo {
    optional int32 Status = 1;           // 開關(1,0) (返利活動)
    optional int32 UnionPlatform = 2;    // 种类(如轰达或77) (返利活動)
    optional int32 FlowAmountNow = 3;    // 目前流水 (返利活動)
    optional int32 FlowAmountLimit = 4;  // 流水限制 (返利活動)
    optional int32 Achievement = 5;      // 是否達標 (返利活動)
    optional int32 FlowAmountRate = 6;   // 返利百分比 (返利活動)
    optional int32 BonusRate = 7;        // 兌換金額倍數 (返利活動)
    optional string CustomerDomain = 8;
}

// 用户大厅登录数据
message UserHallLogonData {
    required string LoginName = 1;                // 用户名
    required string NickName = 2;                 // 昵称
    required int32 UserType = 3;                  // 用户类型
    required int32 Sex = 4;                       // 用户性别
    required int32 HeadID = 5;                    // 头像ID
    required bool IsTopWindow = 6;                // 是否弹窗
    required int64 CashAmount = 7;                // 当前现金数
    required int64 BankAmount = 8;                // 当前银行数
    required bool IsGaming = 9;                   // 是否游戏中
    optional string ServerAddr = 10;              // 服务器地址
    optional string ServerName = 11;              // 服务器名称
    required bool IsKick = 12;                    // 是否踢人
    required bool IsBindGuest = 13;               // 是否绑定游客
    required int32 UserLevel = 14;                // 用户等级
    required string LevelKey = 15;                // 等级校验字符串
    optional string AnnMsg = 16;                  // 弹出公告
    optional string ConvertRateTipMsg = 17;       // 兑换提示消息
    optional string BankPwdTipMsg = 18;           // 银行修改密码提示消息
    optional string UIFlag = 19;                  // UI预留标记
    optional string PaySort = 20;                 // 充值方式开关与顺序
    optional string UpGradeMsg = 21;              // 升级提示
    optional int32 LockGameID = 22;               // 是否在游戏中
    required bool IsBindZhifubao = 23;            // 是否绑定支付宝
    optional string Zhifubao = 24;                // 支付宝账号
    optional string RealName = 25;                // 真实姓名
    repeated int32 GameList = 26;                 // 游戏列表
    optional string PayAmountConfig = 27;         // 充值金额配置
    optional string PayNotifyMsg = 28;            // 充值到账通知信息
    optional string NotifyFlag = 29;              // 通知标记0没有通知，1有通知  第1位表示是否有新邮件 后面位数备用
    optional string PayTips = 30;                 // 充值提示说明
    required bool IsBindBankCard = 31;            // 是否绑定銀行卡
    optional string BankName = 32;                // 銀行名稱
    optional string BankCode = 33;                // 銀行代碼
    optional string BankCardNum = 34;             // 銀行卡號
    optional string BankRealName = 35;            // 銀行卡姓名
    optional string PayAmountRange = 36;          // 充值金額範圍配置
    optional string UISort = 37;                  // 充值分類排序
    repeated GameList2 GameList2 = 38;            // 游戏列表含狀態
    repeated Banner Banner = 39;                  // 廣告輪播圖
    required int32 SumCharge = 40;                // 充值金額
    required int32 ShowConvertLimit = 41;         // 顯示兌換的充值金額 (單位分)
    required int32 ShowAllGameLimit = 42;         // 顯示所有遊戲充值金額 (單位分)
    optional string QuestionContactTip = 43;      // 詢問客服系統提示文字
    optional int32 AnnMsgShow = 44;               // 公告開關
    optional bool ClubOpen = 45;                  // 是否開啟代理
    repeated PaymentInfo PaymentInfoList = 46;    // 支付信息列表
    optional int32 ConvertBankShow = 47;          // 是否顯示兌換銀行顯示
    optional int32 ConvertAlipayShow = 48;        // 是否顯示兌換支付寶顯示
    optional int32 Area_ID = 49;                  // 渠道ID
    optional int64 ShowVIPAgent = 50;             // 多少金額可以顯示ＶＩＰ代理
    optional int32 ShopNameID = 51;               // 1=商城 2=支付
    optional int32 AgentNameID = 52;              // 1=代理支付 2=VIP
    optional int64 ShowCS = 53;                   // 顯示客服充值金額 (單位分)
    optional int32 PlaytimeCS = 54;               // 游戏多久显示客服
    optional int32 PlaytimeConvert = 55;          // 游戏多久显示兑换
    optional int32 PlaytimeVIPAgent = 56;         // 游戏多久显示充值代理
    optional int32 ShowConvertBindPhone = 57;     // 是否綁定手機顯示兌換
    optional int32 ShowAllGameBindPhone = 58;     // 是否綁定手機顯示所有遊戲
    optional int32 ShowVIPAgentBindPhone = 59;    // 是否綁定手機顯VIP代理
    optional int32 ShowCSBindPhone = 60;          // 否綁定手機顯示客服
    optional int32 ShowConvertPopup = 61;         // 是否強制顯示兌換按鈕
    optional string ConvertPopupText = 62;        // 強制顯示兌換按鈕時的訊息內容    
    optional int32 WinLossFlowAmount = 63;        // 输赢流水
    optional int32 ExchangeFlowAmount = 64;       // 兌換所需流水
    optional int32 DayFlowAmount = 65;            // 当日流水
    optional int32 SevenDayFlowAmount = 66;       // 近7天流水
    optional int32 MonthFlowAmount = 67;          // 本月流水
};

// 支付信息
message PaymentInfo {
    required int32 GWID = 1;
    required int32 TypeID = 2;
    required string TypeName = 3;
    required string AmountSort = 4;
    optional int32 Area_ID = 5;  // 渠道ID
}

// 廣告輪播圖
message Banner {
    required string Picture = 1;
    required string Link = 2;
    required int32 Behavior = 3;
    optional int32 Area_ID = 4;  // 渠道ID
}

// 游戏列表含狀態
message GameList2 {
    required int32 GameID = 1;
    required int32 Popular = 2;
    optional string IconName = 3;
    optional string AliasName = 4;
    optional string IconTitle = 5;
    optional string Skin = 6;
    optional int32 Area_ID = 7;  // 渠道ID
    optional int32 IsThirdParty = 8; // 是否三方遊戲
}

// 用户登出
message UserLogout {
    required int32 UserID = 1;   // 用户ID
    required string Cer = 2;     // 证书
    optional int32 Area_ID = 3;  // 渠道ID
};

// 平台版本信息
message HallVerReq {
    required int64 AreaId = 1;
    optional int32 Area_ID = 2;  // 渠道ID
};

// 注意版本号字符串可能为空。这时服务器可能是在出错的情况下。 客户端应该提示错误并退出
message HallVerInfo {
    required string AndroidVersion = 1;
    required string IOSVersion = 2;
    optional string UpdateDomain = 3;
    optional string BillDomain = 4;
    optional string ClubDomain = 5;
    optional string CustomerDomain = 6;
    optional string AreaConfig = 7;
    optional int32 Area_ID = 8;  // 渠道ID
    optional string AndroidVersion2 = 9;
    optional string IOSVersion2 = 10;
    optional string UpdateDomain2=11;
    optional int64 GiftMoney=12; //綁定贈金
    optional int64 DefaultMoney=13; //預設金幣
};

// 所有服务器信息
message AllGameServerInfo {
    repeated GameServerInfo ServerList = 1;
    optional int32 Area_ID = 2;                     // 渠道ID
    optional GameCategoryList GameCategory = 3;     // 游戏分类清单
};

// 游戏服务器列表
message GameServerInfo {
    required int32 GameID = 1;           //游戏ID
    required string GameName = 2;        //游戏名称
    required int32 LoginMoney = 3;       //入场金币数
    required string Flag = 4;            //标记
    required string Status = 5;          //状态
    required int32 BaseScore = 6;        //底分
    optional int32 Single = 7;           //直接進入取第一個服務器進入, 0=>顯示房間列表, 1=>第一個服務器進入
    optional string AndroidVersion = 8;  // 客戶端版本號
    optional string IOSVersion = 9;      // 客戶端版本號
    optional int32 KickOutMoney = 10;    //入场金币数
    optional int32 MaxOdd = 11;          // 最高倍數
    optional int32 GameType = 12;        //遊戲類型: 1.真錢 2.比賽 3.休閒
    optional int32 Area_ID = 13;         // 渠道ID
    optional int32 Port = 14;
    optional int32 ServerID = 15;
    optional string IPAddress = 16;
};

// 请求游戏服务器地址
message RequestGameServerAddrInfo {
    required string ServerFlag = 1;  //服务器标记
    required int32 GameID = 2;       //游戏ID
    optional int32 Area_ID = 3;      // 渠道ID
};

// 游戏服务器地址信息
message GameServerAddr {
    required int32 ServerID = 1;    //服务器ID
    required string IPAddress = 2;  //服务器地址
    required int32 Port = 3;        //服务器端口
    optional int32 Area_ID = 4;     // 渠道ID
    optional int32 StatusID = 5;    // 0正常, 1異常重連
};

// 绑定支付宝
message ZhifubaoInfo {
    required string Zhifubao = 1;  //支付宝
    required string RealName = 2;  //实名
    required string VCode = 3;     //验证码
    required int32 CodeType = 4;   //验证码类型, 4綁定, 5變更
    optional int32 Area_ID = 5;    // 渠道ID
};

// 绑定銀行卡
message BankCardInfo {
    required string BankCardNum = 1;  //銀行卡號
    required string RealName = 2;     //实名
    required string BankCode = 3;     //銀行代碼
    required string VCode = 4;        //验证码
    required int32 CodeType = 5;      //验证码类型, 4綁定, 5變更
    optional int32 Area_ID = 6;       // 渠道ID
};

// 修改密码
message ModifyPassword {
    required string OldPwd = 1;       //旧密码
    required string NewPassword = 2;  //新密码
    optional int32 Area_ID = 3;       // 渠道ID
};

// 发送验证码
message SendPhoneVCode {
    optional string Tel = 1;      //用户手机号码
    required int32 CodeType = 2;  //验证码类型	 1 注册 2 找回密码 3 找回银行密码 4 綁定兌換帳號資訊 5 變更兌換帳號資訊
    optional int32 Area_ID = 3;   // 渠道ID
};
// 发送验证码结果
message SendPhoneVCodeRet {
    required int32 Code = 1;
    required string Message = 2;
    required int32 CountDown = 3;
    required int32 CodeID = 4;
    optional int32 Area_ID = 5;  // 渠道ID
};

// 修改头像
message ModifyFace {
    required int32 FaceID = 1;
    optional int32 Area_ID = 2;  // 渠道ID
};

// 存取款
message MoneyDeposit {
    required int64 Amount = 1;
    optional string MoneyPassword = 2;
    required int32 OP = 3;       // 0 存款 1 取款
    optional int32 Area_ID = 4;  // 渠道ID
};

// 存取款结果
message MoneyDepositRet {
    required int64 Amount = 1;
    required int32 OP = 2;  // 0 存款 1 取款
    required int32 Code = 3;
    required string Message = 4;
    required int64 CurrentMoney = 5;
    required int64 CurrentBank = 6;
    optional int32 Area_ID = 7;  // 渠道ID
};

// 绑定游客账号
message BindGuestAccount {
    required string Tel = 1;       // 手机号码
    required string VCode = 2;     // 验证码
    required string Password = 3;  // 密码
    optional int32 Area_ID = 4;    // 渠道ID
};

// 请求用户大厅信息
message RequestUserHallInfo {
    required int32 SiteID = 1;   // 渠道ID
    optional int32 Area_ID = 2;  // 渠道ID
};

// 找回账号密码信息
message FindSetPwdByPhone {
    required string Tel = 1;       // 手机号码
    required string VCode = 2;     // 验证码
    required string Password = 3;  // 密码
    optional int32 Area_ID = 4;    // 渠道ID
};

// 修改银行密码
message ModifyBankPassword {
    required string OldPwd = 1;       // 旧密码
    required string NewPassword = 2;  // 新密码
    optional int32 Area_ID = 3;       // 渠道ID
};

// 找回银行密码信息
message FindSetBankPwdByPhone {
    required string VCode = 1;     // 验证码
    required string Password = 2;  // 密码
    optional int32 Area_ID = 3;    // 渠道ID
};

//邮件详情
message MailDetail {
    required int32 ID = 1;         //邮件ID
    required string Title = 2;     //邮件标题
    required string Content = 3;   //邮件内容
    required bool IsRead = 4;      //是否已读
    required string SendTime = 5;  //发送时间
    optional int32 Area_ID = 6;    // 渠道ID
};

//获取邮件列表
message MailList {
    repeated MailDetail MailList = 1;  // 邮件列表
    optional int32 Area_ID = 2;        // 渠道ID
};

// 获取邮件详情
message RequestMailDetail {
    required int32 ID = 1;       // 邮件ID
    optional int32 Area_ID = 2;  // 渠道ID
};

// 发送联系客服问题
message ContactService {
    required string Msg = 1;
    required int32 QuestionType = 2;  // 0無分類, 1無法登錄, 2帳號異常, 3其他
    required int32 PlatformID = 3;
    required int32 AreaID = 4;
    optional int32 Area_ID = 5;  // 渠道ID
};

// 代理详情
message AgentDeatil {
    required string Name = 1;     // 代理名称
    required string WXNo = 2;     // 徽信号
    required string QQ = 3;       // QQ号
    optional string Alipay = 4;   // Alipay号
    optional string Jiuliao = 5;  // 久聊
    optional int32 Area_ID = 6;   // 渠道ID
};

// 代理列表
message AgentList {
    repeated AgentDeatil AgentList = 1;  // 代理列表
    optional int32 Area_ID = 2;          // 渠道ID
};

// 举报代理信息
message ReportAgent {
    required int32 AreaID = 1;      // 渠道ID
    required string AgentName = 2;  // 代理名称
    required string Content = 3;    // 举报内容
    optional int32 Area_ID = 4;     // 渠道ID
};

// 请求代理信息
message RequestAgentList {
    required int32 AreaID = 2;   // 渠道ID
    optional int32 Area_ID = 3;  // 渠道ID
};

// 代理招商
message ApplyAgent {
    required int32 AreaID = 1;   // 渠道ID
    required string Name = 2;    // 姓名
    required string Tel = 3;     // 电话
    required string QQ = 4;      // QQ号码
    required string WXNo = 5;    // WX号
    required string Memo = 6;    // 说明
    optional string Alipay = 7;  // Alipay
    optional int32 Area_ID = 8;  // 渠道ID
};

// 兑换金币信息
message ConvertMoney {
    required int64 Amount = 1;       // 兑换数量,单位分
    required int32 ConvertType = 2;  // 兌換方式,1.支付寶 2.銀行卡
    optional int32 Area_ID = 3;      // 渠道ID
};

// 创建充值订单请求信息
message CreatePayOrder {
    required int32 PayTypeID = 1;  // 充值类型 1.支付宝 2.微信 3.银联 4.QQ钱包
    required int64 Amount = 2;     // 充值数量,单位分
    optional int32 Area_ID = 3;    // 渠道ID
};

// 创建充值订单返回信息
message CreatePayOrderRet {
    required int32 code = 1;      // 订单创建结果
    required string message = 2;  // 返回消息
    required int32 OrderID = 3;   // 订单编号
    optional int32 Area_ID = 4;   // 渠道ID
};

// 获取FAQ信息
message GetFAQ {
    required int32 PlatformID = 1;  // 平台ID
    optional int32 Area_ID = 2;     // 渠道ID
};

// FAQ信息
message FAQDetail {
    required string Content = 1;  // FAQ内容
    optional int32 Area_ID = 2;   // 渠道ID
};

// 查詢兌換記錄
message GetConvertLog {
    required int32 TnyStatus = 1;  // 狀態
                                   // {0:"兑换完成",1:"审核中",2:"审核通过",3:"已打款",4:"订单异常",5:"异常帐号",6:"黑名单",7:"账户错误",8:"拒绝兑换",9:"疑似洗钱",10:"补单完成
                                   // ",11:"退还金币",99:"全部"};
    required int32 LogRange = 2;  // 1(一周),2(半個月),3(一個月),4(三個月)
    optional int32 Area_ID = 3;   // 渠道ID
}

// 兌換記錄
message ConvertLogDetail {
    required int64 Amount = 1;       // 兌換金額,單位分
    required int64 TaxAmount = 2;    // 手續費,單位分
    required int32 Status = 3;       // 狀態
    required string Payment = 4;     // 收款方式
    required string CreateTime = 5;  // 兌換時間
    optional int32 Area_ID = 6;      // 渠道ID
}

// 兌換記錄列表
message ConvertLogList {
    repeated ConvertLogDetail ConvertLogList = 1;  // 兌換記錄列表
    optional int32 Area_ID = 2;                    // 渠道ID
}

// 銀行資訊
message BankDetail {
    required string BankCode = 1;  // 銀行代碼
    required string BankName = 2;  // 銀行名稱
    optional int32 Area_ID = 3;    // 渠道ID
}

// 銀行資訊列表
message BankList {
    repeated BankDetail BankList = 1;  // 銀行資訊列表
    optional int32 Area_ID = 2;        // 渠道ID
}

// 登入獎勵
message LoginBonusData {
    required int32 LoginTimes = 1;                     // 己領取次數
    required int32 RetCode = 2;                        // 領取代碼 0 本日己領取, 1 成功領取, 2可領取, -1 活動不存在, -2
                                                       // 已領超過七次限制, -3 充值金額不足, -4 帳號未綁定
    required string RetMsg = 3;                        // 領取訊息
    optional int64 CurrentAmount = 4;                  // 領取後用戶金幣數量
    optional int64 GiftCash = 5;                       // 最低充值金額
    optional int32 Area_ID = 6;                        // 渠道ID    
    repeated LoginBonusConfig LoginBonusConfigList=7;  //登入獎勵設定
}

//登入獎勵設定
message LoginBonusConfig {
    required int32 Day=1; //日
    required int64 BonusAmount=2; //獎勵金額(分)
}


// 取得代理資訊
message AgentData {
    required int32 UserID = 1;                     // 用戶ID
    required int32 RetCode = 2;                    // 返回消息 0 代理, -1 非代理
    required AgentDetailData AgentDetailData = 3;  // 代理詳細資訊
    repeated AgentDownSteam DownSteamList = 4;     // 代理下線資訊
    optional int32 Area_ID = 5;                    // 渠道ID
}

// 代理詳細資訊
message AgentDetailData {
    required int32 UserID = 1;          // 用戶ID
    required int32 Class = 2;           // 階級( 0 系統管理者 1 一級代理  2 二級代理 99 一般玩家  100 渠道代理)
    required int32 Status = 3;          // 狀態( 0 關閉; 1 開啟 2 審核中)
    required int32 Level = 4;           // 等級( 1 王者 2 黃金 3 鑽石)
    required string InviteCode = 5;     // 代理邀請碼
    required int32 ParentUserID = 6;    // 上級代理ID
    required int32 TotalFlows = 7;      // 總流水
    required int32 TotalIncome = 8;     // 總收入
    required int32 RemainAmount = 9;    // 提領後剩餘可提領金額
    required int32 CanBeAgent = 10;     // 是否可成為代理 0不行 1可以
    required string OfficeUser1 = 11;   // 1號諮詢專員
    required string ParentWeixin = 12;  // 上級的微信號
    required string DownloadURL = 13;   // 上級的URL
    required int32 CurrentIncome = 14;  // 總收入
    required string OfficeUser2 = 15;   // 2號諮詢專員
    required string OfficeUser3 = 16;   // 3號諮詢專員
    required string QRUrl = 17;         // 二維碼地址
    required int32 User1Type = 18;      // 客服代理類別1
    required int32 User2Type = 19;      // 客服代理類別2
    required int32 User3Type = 20;      // 客服代理類別3
    optional int32 Area_ID = 21;        // 渠道ID
}

// 代理下線資訊
message AgentDownSteam {
    required int32 UserID = 1;     // 用戶ID
    required int32 Yesterday = 2;  // 昨日流水
    required int32 Today = 3;      // 今日流水
    optional int32 Area_ID = 4;    // 渠道ID
}

// 申請代理下線
message JoinAgentList {
    required int32 UserID = 1;       // 用戶ID
    required string InviteCode = 2;  // 邀請碼
    required int32 RetCode = 3;      // 返回消息 1 成功, -1 失敗(邀請碼錯誤或是代理已綁定)
    required string RetMsg = 4;      // 結果狀態
    optional int32 Area_ID = 5;      // 渠道ID
}

// 申請成為代理
message ApplyAgentList {
    required int32 UserID = 1;   // 用戶ID
