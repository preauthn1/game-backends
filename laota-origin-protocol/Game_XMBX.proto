syntax = "proto2";

package netproto;

// XMBX 熊貓報喜遊戲訊息
enum XMBX_GameMessageClassID {
    // Default
    XMBX_UserEnterID = 4;
    XMBX_UserLeaveID = 5;
    XMBX_UserStateChangeID = 6;
    XMBX_GameStartID = 7;
    XMBX_GameEndID = 8;

    // Server to Client 20xxx
    XMBX_SettingID = 20001;  // 設置相關
    XMBX_StatusID = 20002;   // 遊戲狀態 0: 玩家可下注, 1: 開獎, 2: 開獎動畫, 3: 結算動畫, 4: 等待遊戲開始
    XMBX_BetStatusID = 20003;  // 下注狀態 0: 下注成功, -1: 用戶金額不足, -2: 下注的類型未找到, -3: 莊家不能下注, -4: 此類下注已達到上限, -5: 非下注階段, -6: 用戶金額小於下注限制
    XMBX_GameResultID = 20004;         // 遊戲結果 (轉出內容，中獎項目，中獎金額)
    XMBX_LeftFreeGameID = 20005;       // 剩餘免費遊戲資訊
    XMBX_LightningPrepareID = 20006;   // Lightning 準備訊息
    XMBX_LightningResultID = 20007;    // Lightning 結果
    XMBX_SelectGameOptionsID = 20008;  // 通知可以進行選擇機會
    XMBX_BonusGameID = 20009;          // BonusGame 資訊
    XMBX_GameReelSettingID = 20010;    // 排列帶資訊
    XMBX_IncreaseGameTimesID = 20011;  // 遊戲次數增加封包 可為[FreeGame], [JackpotGame]

    // Client to Server 21xxx
    XMBX_ActionSpinID = 21001;           // 玩家Spin
    XMBX_ActionLightningSpinID = 21002;  // Lightning 轉轉轉
    XMBX_ActionChooseGameID = 21003;     // 選擇遊戲模式

    // 會一來一回的資訊 22xxx
    XMBX_LoadHistoryID = 22001;     // 玩家查詢記錄
    XMBX_LoadHistoryRetID = 22002;  // 回傳玩家查詢記錄
    XMBX_JackpotPoolID = 22003;     // 查詢獎池資訊
    XMBX_JackpotPoolRetID = 22004;  // 回傳獎池資訊
    XMBX_PickBonusID = 22005;       // 玩家選則PickGame
    XMBX_PickBonusRetID = 22006;    // Server回覆，玩家選則PickGame

    // DB Handler {ID}xxxx
    XMBX_SelectGameReadID = 10000001;     // 查詢選擇遊戲機會
    XMBX_SelectGameReadRetID = 10000002;  // 回傳選擇遊戲機會
    XMBX_SelectGameRecordID = 10000003;   // 更新選擇遊戲機會

    XMBX_FreeGameReadID = 10000011;     // 查詢免費遊戲
    XMBX_FreeGameReadRetID = 10000012;  // 回傳免費遊戲
    XMBX_FreeGameRecordID = 10000013;   // 更新免費遊戲

    XMBX_JackpotNoLinkReadID = 10000021;     // 查詢非連線獎池資訊
    XMBX_JackpotNoLinkReadRetID = 10000022;  // 回傳非連線獎池資訊
    XMBX_JackpotNoLinkRecordID = 10000023;   // 更新非連線獎池資訊

    XMBX_GameLogReadID = 10000031;      // 查詢玩家記錄
    XMBX_GameLogReadRetID = 10000032;   // 回傳玩家記錄
    XMBX_GameLogAddID = 10000033;       // 更新玩家記錄
    XMBX_GameLogBatchAddID = 10000034;  // 更新玩家記錄(多筆)

    XMBX_BonusGameReadID = 10000041;     // 查詢BonusGame
    XMBX_BonusGameReadRetID = 10000042;  // 回傳BonusGame
    XMBX_BonusGameRecordID = 10000043;   // 更新BonusGame
    XMBX_BonusGameResetID = 10000044;    // 重置BonusGame

    XMBX_LightningReadID = 10000051;     // 向DB讀取Lightning資訊
    XMBX_LightningReadRetID = 10000052;  // DB回傳讀取Lightning資訊
    XMBX_LightningRecordID = 10000053;   // 向DB更新Lightning資訊

    XMBX_DeferredAwardReadID = 10000061;     // 向DB讀取DeferredAward資訊
    XMBX_DeferredAwardReadRetID = 10000062;  // DB回傳讀取DeferredAward資訊
    XMBX_DeferredAwardRecordID = 10000063;   // 向DB更新DeferredAward資訊
    XMBX_DeferredAwardPopID = 10000064;      // 使用一次DeferredAward
    XMBX_DeferredAwardResetID = 10000065;    // 重置 DeferredAward Pop到死
};