syntax = "proto2";

package netproto;

import "GameMsg.proto";

//下注设置
message HHNN_Setting {
    repeated int32 BetCount = 1;     //一次下注的数量
    required int32 BetMoney = 2;     //一次下注的钱
    required int64 ZhuangLimit = 3;  //上庄钱限制
	optional int64 betlimitmoney=4;//下注攜帶金額限制
};

//状态消息
message HHNN_Sate {
    required int32 State = 1;  //状态
    required int32 Time = 2;   //此状态的剩余时间
};

//用户断线重连下注消息
message HHNN_UserBetInfo {
    required int64 UserMoney = 1;
    repeated HHNN_BroadCastBet BetInfo = 2;
};

//广播用户下注的数组
message HHNN_BroadCastBetArr {
    required int32 UserID = 1;
    repeated HHNN_BroadCastBet BroadCastBetArr = 2;
};

//广播用户下注内容数据结构
message HHNN_BroadCastBet {
    required int32 Type = 1;
    required int64 Money = 2;
    required bool LuckyStar = 3;
};

//用户下注数组
message HHNN_BetArr {
    repeated HHNN_Bet BetArr = 1;
};

//用户下注数据结构
message HHNN_Bet {
    required int32 BetType = 1;
    required int32 Count = 2;
};

//下注的结果
message HHNN_BetRet {
    required int32 Ret = 1;  // 0下注成功，-1用户金额不足，-2下注的类型未找到，-3庄家不能下注，-4此类下注已达到上限，-5不可同时下注龙与虎，-6用户金额小於下注限制
    required int64 Money = 2;      //用户的钱，下注以后的金额。
    optional int32 Type = 3;       //下注超过限制的下注类型
    repeated HHNN_Bet BetArr = 4;  //用户下注数据
}

//游戏用户赢钱结果
message HHNN_GameResultUserMoney {
    required int64 ZhuangWin = 1;
    required int64 SelfWin = 2;
    repeated HHNN_WinUerInfo WinUserInfo = 3;     //赢钱前三名的人信息
    repeated HHNN_StageUerInfo StageUerInfo = 4;  //標誌玩家赢钱信息
};
//赢钱玩家信息
message HHNN_WinUerInfo {
    required string UserName = 1;
    required int64 Win = 2;
};
//標誌玩家赢钱信息
message HHNN_StageUerInfo {
    required int32 UserID = 1;
    required int64 Win = 2;
};

message HHNN_Cards {
    repeated HHNN_Poker Cards = 1;
    required int32 RoundID = 2;  //局數
};

//上庄结果
message HHNN_ShangzhuangRet {
    required int32 ret = 1;  //值为1时下庄成功，值为0表示上庄成功，值为-1时上庄失败资金不足，值为-2时已经在上庄列表中。
};

//是否上庄
message HHNN_ShangZhuang {
    required bool IsShangZhuang = 1;
};

//庄家信息
message HHNN_ZhuangInfo {
    required int32 UserID = 1;
    required int32 LastTurn = 2;
    repeated GameUser UserInfo = 3;
};

//上庄列表
message HHNN_ZhuangList {
    repeated GameUser UserInfo = 1;
};
//清除结果回应消息
message HHNN_BetClearRet {
    required int64 Money = 1;  //当前的钱
    required int32 Ret = 2;    //清除结果-1，清理失败，达到清理上限，0清理成功
};

//大富豪列表消息
message HHNN_RichestList {
    repeated HHNN_Richest RichestList = 1;  //富豪的排行榜
};

//大富豪的玩家資訊
message HHNN_Richest {
    required int32 Ranking = 1;        //富豪排名
    required int32 UserID = 2;         //富豪ID
    required int32 UserFaceID = 3;     //富豪頭像ID
    required int64 Money = 4;          //富豪当前身上的钱
    optional int32 AvatarFrameID = 5;  // VIP頭框像ID
};

//幸運星玩家消息
message HHNN_LuckyStarList {
    repeated HHNN_LuckyStar LuckyStarList = 1;  //幸運星玩家資訊
};

//幸運星玩家資訊
message HHNN_LuckyStar {
    required int32 UserID = 1;         //幸運星ID
    required int32 UserFaceID = 2;     //幸運星頭像ID
    optional int32 AvatarFrameID = 3;  // VIP頭框像ID
};

//本局局數
message HHNN_RoundID {
    required int32 HungWin = 1;  //紅贏局數
    required int32 HeiWin = 2;   //黑贏局數
    required int32 RoundID = 3;  //局數
};

//廣播發牌第一手三張牌
message HHNN_BrodcastPokerCard {
    repeated HHNN_BrodcastUserPokerCard UserPokerCard = 1;
}
//每個座位上的亮牌
message HHNN_BrodcastUserPokerCard {
    required int32 SitNo = 1;
    repeated PokerCard CardGroup = 2;
}

//前20次开出的牌
message HHNN_ResultCardList {
    repeated HHNN_GameResultPoker CardList = 1;
};

//游戏扑克结果
message HHNN_GameResultPoker {
    required HHNN_Poker HungPoker = 1;  //紅區扑克牌
    required HHNN_Poker HeiPoker = 2;   //黑區扑克牌
    required int32 Win = 5;             //贏家，1:紅，2:黑
    required int32 RoundID = 6;         //局數
};

//一局的
message HHNN_Poker {
    required int32 NiuNiuRet = 2;     //牛牛類型: 0 五小牛; 1四炸; 2 五花牛; 3 牛牛; 4 有牛; 5 無牛;
    required int32 NiuNiuNumber = 3;  //牛幾
    repeated PokerCard Cards = 4;     //牌
};