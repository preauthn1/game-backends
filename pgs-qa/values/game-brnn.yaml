game:
  brnn:
    id: 19
    name: 百人牛牛
    group: poker
    room:
      - serverid: 219000410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2190				                //游戏ID
            gamename=百人牛牛			                //游戏名称
            flag=41				                    //显示名称,客户端可根据此名称将房间分类显示
            minplayer=1                             //游戏最小人数
            maxplayer=500                           //游戏最大人数
            tablecount=1			                //桌子数
            seatcount=500   		                //椅子数
            loginmoney=0			                //进入游戏最小积分
            scoremode=0				                //0 即时写分 1退房间写分
            maxuser=500				                //最大人数
            taxscale=5				                //抽水比例
            readywaittime=30		                //举手超时时间,单位秒
            reghallserverinterval=5	                //注册广场时间间隔,单位秒
            bettime=22				                //下注时间
            basescore=100			                //底分
            kaijiangactiontime=6	                //开奖动画超时
            endactiontime=6		                    //结算动画超时
            zhuanglimit=1000000		                //上庄资金限制
            zhuangturn=8			                //庄局数
            betcount=100,500,1000,5000,10000,50000	//一次下注的数量
            maxclearcount=1			                //最大清除次数
            maxrobotzhuang=5			            //最多多少个机器人上庄
            robotxiazhuang=30			            //机器人下庄概率百分比
            robotzhuang=100				            //没有人当庄的时候机器人当庄的概率百分比
            winline=2500000				            //机器人赢钱线
            scoresection=0,1000		                //分数段
            pokertype=1				            	//1随机发牌 2 发牌器发牌
            zhushui=0                               //注水比例
            deallog=2				            	//牌局记录器类型 0 不记录 1 文本 2 db
            single=1				            	//单间房是否可直接入场 0:不可 1：可
            betlimitmoney=20		            	//下注攜帶金額限制
            publiczhuang=1			            	//是否開啟上庄功能0:關閉 1：開啟
            luckystarround=5		            	//幸運星持續回合數

            [robot]
            enable=0								//是否开启机器人
            logoninterval=30						//加载机器人时间间隔
            minmneyamount=1000000					//机器人最小金币数
            maxmoneyamount=2000000					//机器人最大金币数
            queuecheckwaitspan=5,10					//配桌检查时间间隔
            queueagainwaitspan=3,5					//继续配桌时间间隔
            tablemaxusercount=31					//配桌时桌子上最大人数
            tableminusercount=0						//配桌时桌子上最小人数
            gameendleaveodds=0.5					//游戏结束时离开游戏几率
            autositwaitspan=1,3						//主动入座时间间隔
            gameactionwaitspan=1,4					//游戏动作响应时间间隔
            gamereadywaitspan=3,5					//游戏准备响应时间间隔
            maxusergameendleaveodds=1				//人数达到上限时离开游戏几率
            maxcardsrndlvl=1						//机器人换牌概率值
            matchtablemode=2                        //配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人 2固定配機器人可配置上限
            tablematchrobotrate=30,100              //為機器人人數,100機率%.  桌子隨機配N個機器人. 機率要設滿100%


            [gamequeue]
            gamematchwaitmintime=1		//撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=2		//撮合时间间隔范围大值,单位秒
            againstsameip=0				//同IP不分配一起
            againstlastgame=0			//最后一次游戏过的用户不分配一起
            gameendaction=0				//游戏结束后动作,0 无动作 1 准备
            queuetype=1					//撮合类型 0 时间随机 1 固定人数
            queueusercount=1			//排队人数
            queuetimeout=2				//排队人数超时
          logicconfig.dat: |
            [logicsetting]
            allbetsyspool=60        //玩家全下吃水線表的機率. 60%

            [brnnbetoption]
            count=4
            1=1,1000000//1类型，1一次下注的钱,100000000下注限制
            2=1,1000000
            3=1,1000000
            4=1,1000000


            //Robot庄，水线下，開獎機率總和要100， syspool < winline
            [jiangtyperate]
            naturl=5    //自然機率
            tongsha=4  //通殺機率
            tongpei=4  //通陪機率
            win1loss3=4 //庄贏一輸三機率
            win2loss2=33 //庄贏二輸二機率
            win3loss1=50 //庄贏三輸一機率

            //Robot庄，水线上, syspool > winline
            [realuserzhuangwinline]
            naturl=5    //自然機率
            tongsha=1  //通殺機率
            tongpei=1  //通陪機率
            win1loss3=55 //庄贏一輸三機率
            win2loss2=25 //庄贏二輸二機率
            win3loss1=13 //庄贏三輸一機率//總和不可超過100

            //真人上莊(水線上)
            [realuserzhuangwinpool]
            naturl=75 //自然機率
            tongsha=5 //通殺機率
            tongpei=5 //通陪機率
            win1loss3=5 //庄贏一輸三機率
            win2loss2=5 //庄贏二輸二機率
            win3loss1=5 //庄贏三輸一機率 //總和不可超過100

            //真人上莊(水線下)
            [realuserzhuangsyspool]
            naturl=25    //自然機率
            tongsha=0  //通殺機率
            tongpei=20  //通陪機率
            win1loss3=39 //庄贏一輸三機率
            win2loss2=8 //庄贏二輸二機率
            win3loss1=8 //庄贏三輸一機率 //總和不可超過100

            //通殺 開出的項目賺賠機率
            [tongsharate]
            bigwin=20
            smallwin=80
            smallloss=0
            bigloss=0

            //通賠 開出的項目賺賠機率
            [tongpeirate]
            bigwin=0
            smallwin=0
            smallloss=75
            bigloss=25

            //贏一輸三 開出的項目賺賠機率
            [win1loss3rate]
            bigwin=0       //排序下注金額挑最大金額被吃
            smallwin=0     //排序下注金額挑第二大金額被吃
            smallloss=0
            bigloss=100

            //贏二輸二 開出的項目賺賠機率
            [win2loss2rate]
            bigwin=10
            smallwin=40
            smallloss=38
            bigloss=12

            //贏三輸一 開出的項目賺賠機率
            [win3loss1rate]
            bigwin=100
            smallwin=0
            smallloss=0
            bigloss=0

            //assign win loss card number
            [winlosscard]
            bigwin=7,8,9    //assign card number
            smallwin=4,5,6
            smallloss=4,5,6
            bigloss=1,2,3

            //client相關參數
            [client]
            secondfapeitimeinterval=800       //第二手牌的時間間距. 0秒全發or其他秒數
          robot.dat: |
            [csize]
            cn=8

            [c1]
            //贪心的机器人
            betcount=1,10		//一次下注的数量随机1-10
            bettype=1,2,3,4		//下注类型
            line=45000			//下注到这个值就不再下了

            [c2]
            //偏执于青龙的机器人
            betcount=5,5		//一次下注的数量随机1-10
            bettype=1		    //下注类型
            line=45000			//下注到这个值就不再下了

            [c3]
            //偏执于白虎的机器人
            betcount=5,5		//一次下注的数量随机1-10
            bettype=2		    //下注类型
            line=45000			//下注到这个值就不再下了

            [c4]
            //偏执于朱雀的机器人
            betcount=5,5		//一次下注的数量随机1-10
            bettype=3		    //下注类型
            line=45000			//下注到这个值就不再下了

            [c5]
            //偏执于玄武
            betcount=5,5		//一次下注的数量随机1-10
            bettype=4		    //下注类型
            line=45000			//下注到这个值就不再下了

            [c6]
            //佛性的机器人
            betcount=0,0		//一次下注的数量随机1-10
            bettype=1,2,3,4		//下注类型
            line=45000			//下注到这个值就不再下了

            [c7]
            //贪心的机器人
            betcount=10,10		//一次下注的数量随机1-10
            bettype=1,2,3,4		//下注类型
            line=45000			//下注到这个值就不再下了

            [c8]
            //贪心的机器人
            betcount=10,10		//一次下注的数量随机1-10
            bettype=1,2,3,4		//下注类型
            line=45000			//下注到这个值就不再下了