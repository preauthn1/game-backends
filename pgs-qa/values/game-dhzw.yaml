game:
  dhzw:
    id: 1005
    name: 東海之王
    group: slot
    room:
      - serverid: 100500410
        proto: dhzw-test
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=1005				 	// 游戏ID
            gamename=東海之王  		 	// 游戏名称
            flag=41                        // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=1                   // 遊戲最小人數
            maxplayer=1                   // 遊戲最大人數
            tablecount=480                // 桌子數
            seatcount=1                   // 椅子數
            loginmoney=0                  // 進入遊戲最小積分
            scoremode=0                   // 0 即時寫分 1 退房間寫分 2 比賽 3 分段寫分
            maxuser=480                   // 最大人數
            taxscale=0                    // 抽水比例
            readywaittime=10              // 舉手超時時間,單位秒
            reghallserverinterval=5       // 註冊廣場時間間隔,單位秒
            basescore=100                 // 底分
            deallog=2                     // 牌局記錄器類型 0 不記錄 ,1 文本, 2 db, 3 fish, 4分段寫分
            mincarrymoney=0              // 下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1        // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3        // 撮合時間間隔範圍大值,單位秒
            againstsameip=0               // 同IP不分配一起
            againstlastgame=0             // 最後一次遊戲過的用戶不分配一起
            gameendaction=0               // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1                   // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=1              // 排隊人數
            queuetimeout=2                // 排隊人數超時
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				                            // 结算动画超时
            betcount=1000,2000,3000,5000,6000,10000                              // 一次下注的数量
            betrate=28,38,58,88                                   // 玩家可上調的基本押注數量的倍率

            slotpattern=8                                           // 參考csv SlotPattern類型, 可多個用逗號分
            releasepattern=11    // 放分
            bitepattern=9       // 咬分
            bigwinrule=200,500,800,1200   								//client動畫播放階段,以Bet為主
            bigwinnotify=400                                        // 當下注16, Total=6400(16*400) 得獎超過6400才廣播.

            [description]
            w1.title=百搭
            w1.desc=只出现在一般游戏，可代表任何符号，除了分散符号及黄金背景，只出现在第2、3、4转轴。
            w2.title=百搭
            w2.desc=只出现在免费游戏，可代表任何符号，除了分散符号及黄金背景，只出现在第2、3、4转轴。
            w3.title=百搭
            w3.desc=只出现在免费游戏，可代表任何符号，除了分散符号及黄金背景，只出现在第2、3、4转轴。
            w4.title=百搭
            w4.desc=只出现在免费游戏，可代表任何符号，除了分散符号及黄金背景，只出现在第2、3、4转轴。
            s1.title=分散符号
            s1.desc=出现3或更多时，会进入免费游戏特别奖。\n免费游戏中，当2、3、4、5个符號出现时。即分别赢得5、15、25、50个额外免费游戏。
