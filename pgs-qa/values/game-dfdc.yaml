            endactiontime=1				//结算动画超时
            betcount=50,100,200,300,600,1000     //一次下注的数量
            betrate=8,18,38,68,88 //玩家可上調的基本押注數量的倍率

            slotpattern=5       //參考csv SlotPattern類型, 可多個用逗號分
            releasepattern=5    // 放分
            bitepattern=5       // 咬分

            bigwinrule=1500,7500,13500,19500   //client動畫播放階段,以Bet為主
            bigwinnotify=750    //當下注16, Total=12,000‬(16*750) 得獎超過12,000才廣播.
            isSlideShow=0       //中獎時，是否逐條派彩線輪播(未實做)
