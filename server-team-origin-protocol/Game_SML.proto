syntax = "proto2";

package netproto;

enum SML_GameMessageClassID {
    SMLSettingID = 10001;               // 設置相關 S2C  SML_Setting
    SMLStepID = 10002;                  // 階段ID S2C   SML_StepInfo
    SMLRoundID = 10003;                 // 本局局數 S2C  SML_RoundInfo
    SMLBoardCastBetID = 10004;          // 廣播下注 S2C  SML_BoardCastBet
    SMLGameResultID = 10005;            // 遊戲結果 S2C  SML_GameResult
    SMLGameResultWinID = 10006;         // 遊戲結果贏錢 S2C SML_GameResultWin
    SMLRecordsID = 10007;               // 歷史開獎結果 S2C SML_GameRecords
    SMLRichestListID = 10008;           // 富豪榜列表 S2C SML_RichestList
    SMLLuckyStarListID = 10009;         // 幸運星列表 S2C SML_LuckyStarList

    SMLBetID = 10010;                   // 下注ID C2S    SML_BetRequest
    SMLBetRetID = 10020;                // 下注結果 S2C  SML_BetResponse
    SMLBetClearID = 10011;              // 玩家清除已下的注 C2S SML_BetRequest
    SMLBetClearRetID = 10021;           // 玩家清除已下的注 S2C SML_BetResponse

    SMLBetAreaInfoID = 10100;         // 當前下注區域金額 S2C SML_BetAreaInfo
};
