syntax = "proto2";

package netproto;

enum JZYQ_GameMessageClassID {
    JZYQSettingID = 10001;               // 設置相關 S2C  JZYQ_Setting
    JZYQStepID = 10002;                  // 階段ID S2C   JZYQ_StepInfo
    JZYQRoundID = 10003;                 // 本局局數 S2C  JZYQ_RoundInfo
    JZYQBoardCastBetID = 10004;          // 廣播下注 S2C  JZYQ_BoardCastBet
    JZYQGameResultID = 10005;            // 遊戲結果 S2C  JZYQ_GameResult
    JZYQGameResultWinID = 10006;         // 遊戲結果贏錢 S2C JZYQ_GameResultWin
    JZYQRecordsID = 10007;               // 歷史開獎結果 S2C JZYQ_GameRecords
    JZYQRichestListID = 10008;           // 富豪榜列表 S2C JZYQ_RichestList
    JZYQLuckyStarListID = 10009;         // 幸運星列表 S2C JZYQ_LuckyStarList

    JZYQBetID = 10010;                   // 下注ID C2S    JZYQ_BetRequest
    JZYQBetRetID = 10020;                // 下注結果 S2C  JZYQ_BetResponse
    JZYQBetClearID = 10011;              // 玩家清除已下的注 C2S JZYQ_BetRequest
    JZYQBetClearRetID = 10021;           // 玩家清除已下的注 S2C JZYQ_BetResponse

    JZYQBetAreaInfoID = 10100;         // 當前下注區域金額 S2C JZYQ_BetAreaInfo
};
