{{- $fullName := include "game-server.fullname" . -}}
{{- $svcPort := .Values.adminweb.port -}}
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: {{ $fullName }}-admin-web
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
  {{- with .Values.adminweb.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.adminweb.ingress.tls }}
  tls:
    {{- range .Values.adminweb.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.adminweb.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            backend:
              serviceName: {{ $fullName }}-admin-web
              servicePort: 3000
          {{- end }}
    {{- end }}