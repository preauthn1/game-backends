docker:
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  stage: docker
  tags:
    - docker
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker images

deploy:
  image: dtzar/helm-kubectl
  stage: deploy
  tags:
    - golang
  script: 
    # - kubectl config set-cluster k8s --server="${K8S_SERVER}"
    # - kubectl config set clusters.k8s.certificate-authority-data ${K8S_CERT_AUTH}
    # - kubectl config set-credentials ${K8S_USER_NAME} --token=[REDACTED]"
    # - kubectl config set-context default --cluster=k8s --user=${K8S_USER_NAME}
    # - kubectl config use-context default
    # - kubectl config view
    - kubectl -n dd-dev get cm,pod,svc
    - helm -n dd-dev ls


