variables:
  NAS_HOST: 0.0.0.0
  NAS_USERNAME: release
  NAS_PASSWORD: [REDACTED]
  NAS_VERSION: "2.0"
  NAS_MNT_TARGET: 99.release
  NAS_MNT_FOLDER: mnt/release
  TARGET_TYPE: all
  TARGET_NAME: all
  K8S_SERVER: https://0.0.0.0:6443
  K8S_CERT_AUTH: 
  K8S_USER_NAME: kubernetes-admin
  K8S_USER_TOKEN: [REDACTED]

.go-env:
  image: golang:1.12
  tags:
    - golang
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GO111MODULE: "on"
    GOPROXY: "http://0.0.0.0:3000"
  cache:
    untracked: false
    policy: pull-push
    paths:
      - ${GOPATH}/pkg/mod
      - bin

stages:
  # - test
  # - choose
  # - build
  - docker
  - deploy

