syntax = "proto2";

package netproto;

import "GameMsg.proto";
import "HttpMsg_BJL.proto";

//下注设置
message BJL_Setting{
	repeated int32 BetCount=1;//一次下注的数量
	required int32 BetMoney=2;//一次下注的钱
	required int64 BetMoneyLimit=3;//下注上限
	required int64 ZhuangLimit=4;	//上庄钱限制
	required int32 MaxZhuang=5;		//当庄局数
	required BJL_BetRangeList BetRange=6 ; //下注限制
	optional int64 betlimitmoney=7;//下注攜帶金額限制
};

//状态消息
message BJL_Sate{
	required int32 State=1;//状态
	required int32 Time=2;//此状态的剩余时间
};

//用户断线重连下注消息
message BJL_UserBetInfo{
	required int64 UserMoney=1;
	repeated BJL_BroadCastBet BetInfo=2;
};

//广播用户下注的数组
message BJL_BroadCastBetArr{
	required int32 UserID=1;
	repeated BJL_BroadCastBet BroadCastBetArr=2;
};

//广播用户下注内容数据结构
message BJL_BroadCastBet{
	required int32 Type=1;
	required int64 Money=2;
	required bool LuckyStar=3;
};

//用户下注数组
message BJL_BetArr{
	repeated BJL_Bet BetArr=1;
};

//用户下注数据结构
message BJL_Bet{
	required int32 BetType=1;
	required int32 Count=2;
};

//百家乐下注的结果
message BJL_BetRet{
	required int32 Ret=1;//0下注成功，-1用户金额不足，-2下注的类型未找到，-3庄家不能下注，-4此类下注已达到上限，-5庄閒不可同時下注，-6用户金额小於下注限制
	required int64 Money=2;//用户的钱，下注以后的金额。
	optional int32 Type=3;//下注超过限制的下注类型
	repeated BJL_Bet BetArr=4;//用户下注数据
}


//游戏用户赢钱结果
message BJL_GameResultUserMoney{
	required int64	ZhuangWin=1;
	required int64	SelfWin=2;
	repeated BJL_WinUerInfo WinUserInfo=3;//赢钱前三名的人信息
	repeated BJL_StageUerInfo StageUerInfo=4;//標誌玩家赢钱信息
};

//赢钱玩家信息
message BJL_WinUerInfo{
	required string UserName=1;
	required int64 Win=2;
};

//標誌玩家赢钱信息
message BJL_StageUerInfo{
	required int32 UserID=1;
	required int64 Win=2;
};

message BJL_Cards{
	repeated BJL_GameResultPoker Cards=1;
};

//上庄结果
message BJL_ShangzhuangRet{
	required int32 ret=1;//值为1时下庄成功，值为0表示上庄成功，值为-1时上庄失败资金不足，值为-2时已经在上庄列表中。
};

//是否上庄
message BJL_ShangZhuang{
	required bool IsShangZhuang=1;
};

//庄家信息
message BJL_ZhuangInfo{
	required int32 UserID=1;
	required int32 LastTurn=2;
	repeated GameUser UserInfo=3;
};

//上庄列表
message BJL_ZhuangList{
	repeated GameUser UserInfo=1;
};
//清除结果回应消息
message BJL_BetClearRet{
	required int64	Money=1;//当前的钱
	required int32 Ret=2;//清除结果-1，清理失败，达到清理上限，0清理成功
};


//大富豪列表消息
message BJL_RichestList{
	repeated BJL_Richest RichestList=1; //富豪的排行榜
};

//大富豪的玩家資訊
message BJL_Richest{
	required int32	Ranking=1;//富豪排名
	required int32	UserID=2;//富豪ID
	required int32	UserFaceID=3;//富豪頭像ID
	required int64	Money=4;//富豪当前身上的钱
    optional int32  AvatarFrameID = 5;  // VIP頭框像ID
};

//幸運星玩家資訊
message BJL_LuckyStar{
	required int32	UserID=1;//幸運星ID
	required int32	UserFaceID=2;//幸運星頭像ID
    optional int32  AvatarFrameID = 3;  // VIP頭框像ID
};

//百家樂本局局數
message BJL_RoundID{
	required int32	ZhuangWin=1;//莊贏局數
	required int32	XianWin=2;//閒贏局數
	required int32	HeWin=3;//和局局數
	required int32	RoundID=4;//遊玩總局數
};
//下注限制列表消息
message BJL_BetRangeList{
	required BJL_Range ZhuangXian=1; //庄閑下注限制
	required BJL_Range HeRange=2; //和下注限制
	required BJL_Range DuiZi=3; //對子下注限制
};
//下注限制
message BJL_Range{
	required int32 Max=1; //下注上限
	required int32 Min=2; //下注下限
};