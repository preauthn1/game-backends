syntax = "proto2";

package netproto;

import "GameMsg.proto";
import "HttpMsg_LHD.proto";

//下注设置
message LHD_Setting {
    repeated int32 BetCount = 1;     //一次下注的数量
    required int32 BetMoney = 2;     //一次下注的钱
    required int64 ZhuangLimit = 3;  //上庄钱限制
	optional int64 betlimitmoney=4;//下注攜帶金額限制
};

//状态消息
message LHD_Sate {
    required int32 State = 1;  //状态
    required int32 Time = 2;   //此状态的剩余时间
};

//用户断线重连下注消息
message LHD_UserBetInfo {
    required int64 UserMoney = 1;
    repeated LHD_BroadCastBet BetInfo = 2;
};

//广播用户下注的数组
message LHD_BroadCastBetArr {
    required int32 UserID = 1;
    repeated LHD_BroadCastBet BroadCastBetArr = 2;
};

//广播用户下注内容数据结构
message LHD_BroadCastBet {
    required int32 Type = 1;
    required int64 Money = 2;
    required bool LuckyStar = 3;
};

//用户下注数组
message LHD_BetArr {
    repeated LHD_Bet BetArr = 1;
};

//用户下注数据结构
message LHD_Bet {
    required int32 BetType = 1;
    required int32 Count = 2;
};

//龙虎斗下注的结果
message LHD_BetRet {
    required int32 Ret = 1;  // 0下注成功，-1用户金额不足，-2下注的类型未找到，-3庄家不能下注，-4此类下注已达到上限，-5不可同时下注龙与虎，-6用户金额小於下注限制
    required int64 Money = 2;     //用户的钱，下注以后的金额。
    optional int32 Type = 3;      //下注超过限制的下注类型
    repeated LHD_Bet BetArr = 4;  //用户下注数据
}

//游戏扑克结果
message LHD_GameResultPoker {
    repeated LHD_Poker Poker = 1;  //第一张为龙牌，第二张为虎牌
    required int32 RoundID = 2;    //局數
};

//游戏用户赢钱结果
message LHD_GameResultUserMoney {
    required int64 ZhuangWin = 1;
    required int64 SelfWin = 2;
    repeated LHD_WinUerInfo WinUserInfo = 3;     //赢钱前三名的人信息
    repeated LHD_StageUerInfo StageUerInfo = 4;  //標誌玩家赢钱信息
};
//赢钱玩家信息
message LHD_WinUerInfo {
    required string UserName = 1;
    required int64 Win = 2;
};
//標誌玩家赢钱信息
message LHD_StageUerInfo {
    required int32 UserID = 1;
    required int64 Win = 2;
};

//上庄结果
message LHD_ShangzhuangRet {
    required int32 ret = 1;  //值为1时下庄成功，值为0表示上庄成功，值为-1时上庄失败资金不足，值为-2时已经在上庄列表中。
};

//是否上庄
message LHD_ShangZhuang {
    required bool IsShangZhuang = 1;
};

//庄家信息
message LHD_ZhuangInfo {
    required int32 UserID = 1;
    required int32 LastTurn = 2;
    repeated GameUser UserInfo = 3;
};

//上庄列表
message LHD_ZhuangList {
    repeated GameUser UserInfo = 1;
};
//清除结果回应消息
message LHD_BetClearRet {
    required int64 Money = 1;  //当前的钱
    required int32 Ret = 2;    //清除结果-1，清理失败，达到清理上限，0清理成功
};

//大富豪列表消息
message LHD_RichestList {
    repeated LHD_Richest RichestList = 1;  //富豪的排行榜
};

//大富豪的玩家資訊
message LHD_Richest {
    required int32 Ranking = 1;        //富豪排名
    required int32 UserID = 2;         //富豪ID
    required int32 UserFaceID = 3;     //富豪頭像ID
    required int64 Money = 4;          //富豪当前身上的钱
    optional int32 AvatarFrameID = 5;  // VIP頭框像ID
};

//幸運星玩家消息
message LHD_LuckyStarList {
    repeated LHD_LuckyStar LuckyStarList = 1;  //幸運星玩家資訊
};

//幸運星玩家資訊
message LHD_LuckyStar {
    required int32 UserID = 1;         //幸運星ID
    required int32 UserFaceID = 2;     //幸運星頭像ID
    optional int32 AvatarFrameID = 3;  // VIP頭框像ID
};

//龍虎鬥本局局數
message LHD_RoundID {
    required int32 LongWin = 1;  //龍贏局數
    required int32 HeWin = 2;    //和局
    required int32 HuWin = 3;    //虎贏局數
    required int32 RoundID = 4;  //局數
};