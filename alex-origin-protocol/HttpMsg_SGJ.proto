syntax = "proto2";

package netproto;

message Http_SGJ_GameInfo {
    repeated Http_SGJ_TableList TableList = 1;  //桌子信息
};

message Http_SGJ_TableList {
    required int32 TableNo = 1;            //桌子号
    required int32 Status = 2;             //当前状态 0 下注中 1 开奖中 2结算动画 3等待开始游戏
    required int32 GameUserCount = 3;      //玩家人数(包含未下注玩家)
    required int32 RobotCount = 4;         //机器人数(包含未下注机器人)
    required int64 SumEarnAmount = 5;      //系统从开服到现在的总收益
    required int32 LastEarnAmount = 6;     //最后一局收益
    required int64 PoolCurrentAmount = 7;  //水池剩餘金币数
    required int64 SysTaxIncome = 8;       //系統稅收
    required int64 ZhuShuiMoney = 9;       //当前水池金币数
};

message Http_SGJ_BetBlackDetail {
    required string BlackUserList = 1;  //黑名單UserId
};

message Http_SGJ_TableDetail {
    required int32 TableNo = 1;            //桌子号
    required int32 Status = 2;             //当前状态 0 下注中 1 开奖中 2结算动画 3等待开始游戏
    required int64 SumEarnAmount = 3;      //系统从开服到现在的总收益
    required int32 LastEarnAmount = 4;     //最后一局收益
    required int64 PoolCurrentAmount = 5;  //水池剩餘金币数
    required int32 GameUserCount = 6;      //游戏玩家人数(包含未下注玩家)
    required int32 RobotCount = 7;         //机器人数(包含未下注机器人)
    required int32 PopWaterRate = 8;       //当前注水率

    required int32 ZhuangType = 9;                 //庄家类型	0系统 1机器人当庄 2玩家上庄
    required string ZhuangNickName = 10;           //庄家昵称
    required int32 ZhuangUserID = 11;              //庄家用户ID
    required int32 ZhuangSurplusTotal = 12;        //庄家剩余局数
    required int64 ZhuangCurrentMoneyAmount = 13;  //庄家当前金币数 系统或机器人坐庄则表示水池金币数量
    required int64 ZhuangInitMoneyAmount = 14;     //庄家初始上庄金币数 系统或机器人坐庄则用0表示

    required int64 OpenResultApple = 15;          //当前开奖结果为苹果的收益数量
    required int64 OpenResultAppleMin = 16;       //当前开奖结果为苹果小的收益数量
    required int64 OpenResultOrange = 17;         //当前开奖结果为桔子的收益数量
    required int64 OpenResultOrangeMin = 18;      //当前开奖结果为桔子小的收益数量
    required int64 OpenResultMango = 19;          //当前开奖结果为芒果的收益数量
    required int64 OpenResultMangoMin = 20;       //当前开奖结果为芒果小的收益数量
    required int64 OpenResultBell = 21;           //当前开奖结果为铃铛的收益数量
    required int64 OpenResultBellMin = 22;        //当前开奖结果为铃铛小的收益数量
    required int64 OpenResultWatermelon = 23;     //当前开奖结果为西瓜的收益数量
    required int64 OpenResultWatermelonMin = 24;  //当前开奖结果为西瓜小的收益数量
    required int64 OpenResultDobuleStar = 25;     //当前开奖结果为双星的收益数量
    required int64 OpenResultDobuleStarMin = 26;  //当前开奖结果为双星小的收益数量
    required int64 OpenResult77 = 27;             //当前开奖结果为77的收益数量
    required int64 OpenResult77Min = 28;          //当前开奖结果为77小的收益数量
    required int64 OpenResultBar = 29;            //当前开奖结果为BAR的收益数量
    required int64 OpenResultBarMin = 30;         //当前开奖结果为BAR小的收益数量
    required int64 OpenResultLuckLose = 31;       //当前开奖结果为LuckLose的收益数量

    required string CurentOpenResult = 32;     //当前开奖结果,只有在开奖动画状态下有值
    required int64 CurentOpenResultEarn = 33;  //当前开奖收益,只有在开奖动画状态下有值

    repeated Http_SGJ_UserInfo UserInfo = 34;  //玩家信息
    required int64 SysTaxIncome = 35;          //系統稅收

    required int64 ZhuShuiMoney = 36;  //当前水池金币数
    required int32 BetTime = 37;       //下注時間
};

message Http_SGJ_UserInfo {
    required int32 UserID = 1;                  //玩家ID
    required int32 UserType = 2;                //玩家类型 0机器人 1玩家
    required string NickName = 3;               //玩家昵称
    required int64 GameScore = 4;               //游戏总输赢
    required int64 InitMoney = 5;               //初始金币
    required int64 CurrentMoney = 6;            //当前金币
    required int64 BetInfoUserApple = 7;        //下注苹果的金币数量
    required int64 BetInfoUserOrange = 8;       //下注桔子的金币数量
    required int64 BetInfoUserMango = 9;        //下注芒果的金币数量
    required int64 BetInfoUserBell = 10;        //下注铃铛的金币数量
    required int64 BetInfoUserWatermelon = 11;  //下注西瓜的金币数量
    required int64 BetInfoUserDobuleStar = 12;  //下注双星的金币数量
    required int64 BetInfoUser77 = 13;          //下注77的金币数量
    required int64 BetInfoUserBar = 14;         //下注BAR的金币数量
    required int64 SumCharge = 15;              //總充值
    required int64 SumConvert = 16;             //總兌換
};

//上一次开奖结果
message SGJ_LastGameResultType {
    repeated SGJ_JiangTypeOdd ResultTypeOdd = 1;  //上20次开奖结果
    required int64 BetMoney = 2;                  //当前下注的总钱数
};

//一次开奖结果的类型和倍数
message SGJ_JiangTypeOdd {
    required int32 ResultType = 1;
    required int32 Odd = 2;
};