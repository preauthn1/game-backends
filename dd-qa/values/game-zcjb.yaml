game:
  zcjb:
    id: 29
    name: 招财进宝
    group: slot
    room:
      - port: 13401
        serverid: 385
        proto: zcjb-test
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=29				 	//游戏ID
            gamename=招财进宝		 	//游戏名称
            flag=1				     	//显示名称,客户端可根据此名称将房间分类显示
            minplayer=1              	//游戏最小人数
            maxplayer=1          		//游戏最大人数
            tablecount=480			 	//桌子数
            seatcount=1		    		//椅子数
            loginmoney=0			 	//进入游戏最小积分
            scoremode=0					//0 即时写分 1退房间写分
            maxuser=480					//最大人数
            taxscale=0					//抽水比例
            readywaittime=10			//举手超时时间,单位秒
            reghallserverinterval=5		//注册广场时间间隔,单位秒
            basescore=100				//底分
            single=0					//单间房是否可直接入场 0:不可 1：可
            deallog=2     //牌局记录器类型0 不记录 ,1 文本, 2 db
            mincarrymoney=30 //下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1		//撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=3		//撮合时间间隔范围大值,单位秒
            againstsameip=0				//同IP不分配一起
            againstlastgame=0			//最后一次游戏过的用户不分配一起
            gameendaction=0				//游戏结束后动作,0 无动作 1 准备
            queuetype=1					//撮合类型 0 时间随机 1 固定人数
            queueusercount=1			//排队人数
            queuetimeout=2				//排队人数超时
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				//结算动画超时
            betcount=5,10,20,30,60,100,     //一次下注的数量
            betrate=8,18,38,68,88 //玩家可上調的基本押注數量的倍率

            slotpattern=13       //參考csv SlotPattern類型, 可多個用逗號分
            bigwinrule=150,750,1350,1950   //client動畫播放階段,以Bet為主
            bigwinnotify=750    //當下注16, Total=12,000‬(16*750) 得獎超過12,000才廣播.
            isSlideShow=0       //中獎時，是否逐條派彩線輪播(未實做)
            isRetriggered=1     //Free Spin 過程中，是否能再觸發Free Spin(未實做)
            freeSpinLimit=0     //Free Spin最多可累積的數量(未實做)

            [unit-prefix]
