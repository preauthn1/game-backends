syntax = "proto2";

package netproto;

message Http_BJL_GameInfo {
    repeated Http_BJL_TableList TableList = 1;  //桌子信息
};

message Http_BJL_TableList {
    required int32 TableNo = 1;            //桌子号
    required int32 Status = 2;             //当前状态 0 下注中 1下注结束动画 2开奖中 3开奖动画 4结算动画 5等待开始游戏
    required int32 GameUserCount = 3;      //玩家人数(包含未下注玩家)
    required int32 RobotCount = 4;         //机器人数(包含未下注机器人)
    required int64 SumEarnAmount = 5;      //系统从开服到现在的总收益
    required int32 LastEarnAmount = 6;     //最后一局收益
    required int64 PoolCurrentAmount = 7;  //当前水池金币数
    required int64 SysTaxIncome = 8;       //系統稅收
    required int32 BetTime = 9;            //下注時間
};

message Http_BJL_BetBlackDetail {
    required string BlackUserList = 1;  //黑名單UserId
}

message Http_BJL_TableDetail {
    required int32 TableNo = 1;            //桌子号
    required int32 Status = 2;             //当前状态 0 下注中 1下注结束动画 2开奖中 3开奖动画 4结算动画 5等待开始游戏
    required int64 SumEarnAmount = 3;      //系统从开服到现在的总收益
    required int32 LastEarnAmount = 4;     //最后一局收益
    required int64 PoolCurrentAmount = 5;  //当前水池金币数
    required int32 GameUserCount = 6;      //游戏玩家人数(包含未下注玩家)
    required int32 RobotCount = 7;         //机器人数(包含未下注机器人)
    required int32 PopWaterRate = 8;       //当前注水率

    required int32 ZhuangType = 9;                 //庄家类型	0系统 1机器人当庄 2玩家上庄
    required string ZhuangNickName = 10;           //庄家昵称
    required int32 ZhuangUserID = 11;              //庄家用户ID
    required int32 ZhuangSurplusTotal = 12;        //庄家剩余局数
    required int64 ZhuangCurrentMoneyAmount = 13;  //庄家当前金币数 系统或机器人坐庄则表示水池金币数量
    required int64 ZhuangInitMoneyAmount = 14;     //庄家初始上庄金币数 系统或机器人坐庄则用0表示

    required int64 OpenResultZhuang = 15;  //当前开奖结果为庄的收益数量
    required int64 OpenResultXian = 16;    //当前开奖结果为闲的收益数量
    required int64 OpenResultHe = 17;      //当前开奖结果为和的收益数量

    required string CurentOpenResult = 18;     //当前开奖结果,只有在开奖动画状态下有值
    required int64 CurentOpenResultEarn = 19;  //当前开奖收益,只有在开奖动画状态下有值

    repeated Http_BJL_UserInfo UserInfo = 20;  //玩家信息
    required int64 SysTaxIncome = 21;          //系統稅收
    required int32 BetTime = 22;               //下注時間

    required int64 WinLine = 23;                      //平衡金額
    required int64 RobotBetAmount = 24;               //機器人下注量
    repeated Http_BJL_UserInfo LastGameUserBet = 25;  //上局下注玩家信息
    required int32 ZhuangWinRate = 26;
    required int32 HeWinRate = 27;
    required int32 XianWinRate = 28;
    required int32 ZhuangDZWinRate = 29;
    required int32 XianDZWinRate = 30;
    required int64 FanFengTarget = 31;
    required int64 FanFengComplete = 32;
};

message Http_BJL_UserInfo {
    required int32 UserID = 1;            //玩家ID
    required int32 UserType = 2;          //玩家类型 0机器人 1玩家
    required string NickName = 3;         //玩家昵称
    required int64 GameScore = 4;         //游戏总输赢
    required int64 InitMoney = 5;         //初始金币
    required int64 CurrentMoney = 6;      //当前金币
    required int64 BetInfoZhuang = 7;     //下注庄的金币数量
    required int64 BetInfoZhuangDZ = 8;   //下注庄对子的金币数量
    required int64 BetInfoZhuangTW = 9;   //下注庄天王的金币数量
    required int64 BetInfoZhuangSZ = 10;  //下注庄顺子的金币数量
    required int64 BetInfoXian = 11;      //下注闲的金币数量
    required int64 BetInfoXianDZ = 12;    //下注闲对子的金币数量
    required int64 BetInfoXianTW = 13;    //下注闲天王的金币数量
    required int64 BetInfoXianSZ = 14;    //下注闲顺子的金币数量
    required int64 BetInfoHe = 15;        //下注和的金币数量
    required int64 BetInfoHeTD = 16;      //下注同点和的金币数量
    required int64 SumCharge = 17;        //總充值
    required int64 SumConvert = 18;       //總兌換

    required int64 WinRate = 19;  // 9局勝率
    required int64 BetTotal = 20;
    required bool IsVIP = 21;
};

//前20次开出的牌
message BJL_ResultCardList {
    repeated BJL_GameResultPoker CardList = 1;
};

//游戏扑克结果
message BJL_GameResultPoker {
    repeated BJL_Poker ZhuangPoker = 1;  //庄家扑克牌
    repeated BJL_Poker XianPoker = 2;    //闲家扑克牌
    required uint32 ZuHe = 3;            //组合结果
    required int32 RoundID = 4;          //局數
};

//百家乐牌的点数和花色
message BJL_Poker {
    required int32 Color = 1;   //从0-3，分别表示黑桃，红桃，樱花，方块
    required int32 Number = 2;  //数字1-13，A-K
};