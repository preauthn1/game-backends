syntax = "proto2";

package netproto;

// Slot 共用遊戲訊息 2xxxx
enum Slot_GameMessageClassID {
    // Default
    Slot_UserEnterID = 4;
    Slot_UserLeaveID = 5;
    Slot_UserStateChangeID = 6;
    Slot_GameStartID = 7;
    Slot_GameEndID = 8;

    // Server to Client 20xxx
    Slot_SettingID = 20001;  // 設置相關
    Slot_StatusID = 20002;   // 遊戲狀態 0: 玩家可下注, 1: 開獎, 2: 開獎動畫, 3: 結算動畫, 4: 等待遊戲開始
    Slot_BetStatusID = 20003;  // 下注狀態 0: 下注成功, -1: 用戶金額不足, -2: 下注的類型未找到, -3: 莊家不能下注, -4: 此類下注已達到上限, -5: 非下注階段, -6: 用戶金額小於下注限制
    Slot_GameResultID = 20004;         // 遊戲結果 (轉出內容，中獎項目，中獎金額)
    Slot_LeftFreeGameID = 20005;       // 剩餘免費遊戲資訊
    Slot_LightningPrepareID = 20006;   // Lightning 準備訊息
    Slot_LightningResultID = 20007;    // Lightning 結果
    Slot_SelectGameOptionsID = 20008;  // 通知可以進行選擇機會
    Slot_BonusGameID = 20009;          // BonusGame 資訊
    Slot_GameReelSettingID = 20010;    // 排列帶資訊
    Slot_IncreaseGameTimesID = 20011;  // 遊戲次數增加封包 可為[FreeGame], [JackpotGame]

    // Client to Server 21xxx
    Slot_ActionSpinID = 21001;           // 玩家Spin
    Slot_ActionLightningSpinID = 21002;  // Lightning 轉轉轉
    Slot_ActionChooseGameID = 21003;     // 選擇遊戲模式

    // 會一來一回的資訊 22xxx
    Slot_LoadHistoryID = 22001;     // 玩家查詢記錄
    Slot_LoadHistoryRetID = 22002;  // 回傳玩家查詢記錄
    Slot_JackpotPoolID = 22003;     // 查詢獎池資訊
    Slot_JackpotPoolRetID = 22004;  // 回傳獎池資訊
    Slot_PickBonusID = 22005;       // 玩家選則PickGame
    Slot_PickBonusRetID = 22006;    // Server回覆，玩家選則PickGame

    // DB Handler {ID}xxxx
    Slot_SelectGameReadID = 10000001;     // 查詢選擇遊戲機會
    Slot_SelectGameReadRetID = 10000002;  // 回傳選擇遊戲機會
    Slot_SelectGameRecordID = 10000003;   // 更新選擇遊戲機會

    Slot_FreeGameReadID = 10000011;     // 查詢免費遊戲
    Slot_FreeGameReadRetID = 10000012;  // 回傳免費遊戲
    Slot_FreeGameRecordID = 10000013;   // 更新免費遊戲

    Slot_JackpotNoLinkReadID = 10000021;     // 查詢非連線獎池資訊
    Slot_JackpotNoLinkReadRetID = 10000022;  // 回傳非連線獎池資訊
    Slot_JackpotNoLinkRecordID = 10000023;   // 更新非連線獎池資訊

    Slot_GameLogReadID = 10000031;      // 查詢玩家記錄
    Slot_GameLogReadRetID = 10000032;   // 回傳玩家記錄
    Slot_GameLogAddID = 10000033;       // 更新玩家記錄
    Slot_GameLogBatchAddID = 10000034;  // 更新玩家記錄(多筆)

    Slot_BonusGameReadID = 10000041;     // 查詢BonusGame
    Slot_BonusGameReadRetID = 10000042;  // 回傳BonusGame
    Slot_BonusGameRecordID = 10000043;   // 更新BonusGame
    Slot_BonusGameResetID = 10000044;    // 重置BonusGame

    Slot_LightningReadID = 10000051;     // 向 DB 讀取 Lightning 資訊
    Slot_LightningReadRetID = 10000052;  // DB 回傳讀取 Lightning 資訊
    Slot_LightningRecordID = 10000053;   // 向 DB 更新 Lightning 資訊

    Slot_DeferredAwardReadID = 10000061;     // 向 DB 讀取 DeferredAward 資訊
    Slot_DeferredAwardReadRetID = 10000062;  // DB 回傳讀取 DeferredAward 資訊
    Slot_DeferredAwardRecordID = 10000063;   // 向DB更新 DeferredAward 資訊
    Slot_DeferredAwardPopID = 10000064;      // 使用一次 DeferredAward
    Slot_DeferredAwardResetID = 10000065;    // 重置 DeferredAward Pop 到死

    Slot_UserAssignedModeReadID = 10000071;     // 向 DB 讀取 UserAssignedMode 資訊
    Slot_UserAssignedModeReadRetID = 10000072;  // DB 回傳讀取 UserAssignedMode 資訊
    Slot_UserAssignedModeRecordID = 10000073;   // 向 DB 更新 UserAssignedMode 資訊
    Slot_UserAssignedModeDeleteID = 10000074;   // 刪除 UserAssignedMode
};