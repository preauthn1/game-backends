  please-read-master-deploy-url:
    image: golang:latest
    commands:
      - echo "己編譯完成, 需要手動部署到 Test 及 Stage\n"
      - release_folder=$(ls -d ./release/*/|head -n 1)
      - echo $release_folder
      - build_name=$(basename $release_folder)
      - echo $build_name
      - echo "如需部署 test 服務器, 請訪問 http://0.0.0.0:888/deploy/$build_name\n"
      - echo "如需部署 stage 服務器, 請訪問 http://0.0.0.0:888/deploy/$build_name\n"
      - echo ${DRONE_TAG##v}
      - echo "deploy finish"
    when:
      branch: [ master, release/* ]
      event: [ tag ]
  deploy-to-test:
    image: golang:latest
    commands:
      - release_folder=$(ls -d ./release/*/|head -n 1)
      - echo $release_folder
      - build_name=$(basename $release_folder)
      - echo $build_name
      - curl http://0.0.0.0:888/deploy/$build_name
      - echo "如需部署 qa 服務器, 請訪問 http://0.0.0.0:888/deploy/$build_name\n"
      - echo "或者執行指令 drone deploy rory/GameServer 222 staging"
#      - curl http://0.0.0.0:888/deploy/$build_name
#      - go test
      - echo ${DRONE_TAG##v}
      - echo "deploy finish"
    when:
      branch: [ develop ]
      event: [ tag ]

  deploy-to-qa:
      image: golang:latest
      commands:
        - release_folder=$(ls -d ./release/*/|head -n 1)
        - echo $release_folder
        - build_name=$(basename $release_folder)
        - echo $build_name
        - curl http://0.0.0.0:888/deploy/$build_name
        - go test
        - echo ${DRONE_TAG##v}
        - echo "deploy finish"
      when:
        event: [ deployment ]
        environment: [ staging ]
