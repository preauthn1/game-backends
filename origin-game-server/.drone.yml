debug: true
workspace:
  base: /go
  path: /gameserver
pipeline:
  env-sniff:
    image: target/drone-deploy
    when:
      branch: [ develop ]
      event: [ tag ]
  receive-notify:
    image: diyfr/drone_plugin_teams
    webhook: "https://example.invalid/webhook/1ef22373-712e-43fb-ab7e-f7e1bcd2d4d6@e16cc667-9473-4fc9-9b30-211cdec6647e/JenkinsCI/bf755502cd39488f834cf9dbcb285af9/4a62c4d6-f68a-464f-bf6e-eed5003fccff"
    content:
      title: "收到一個新的 TAG"
      text: 來自分支 ${DRONE_COMMIT_BRANCH} 的 ${DRONE_TAG}
      themeColor: "#4DC89A"
    branch: [ master, develop ]
    when:
      event: [ tag ]
  build-init:
    image: golang:latest
    commands:
      - date=$(TZ=Asia/Taipei date +%Y%m%d)
      - build_name=$date-build-$DRONE_BUILD_NUMBER
      - release_folder=./release/$build_name
      - mkdir -p $release_folder
      - GIT_HASH=`git rev-parse --short HEAD`
      - BUILD_TIME=`TZ=Asia/Taipei date +%FT%T%z`
      - BUILD_NUM=`basename $release_folder`
      - cd $release_folder
      - echo "GitTag=$DRONE_TAG" > version.txt
      - echo "BuildTime=$BUILD_TIME" >> version.txt
      - echo "GitHash=$GIT_HASH" >> version.txt
      - echo "BuildNum=$BUILD_NUM" >> version.txt
      - cat version.txt
  go-test:
    image: golang:latest
    environment:
      GOPATH: /go/gameserver:/go/gameserver/deployserver:/go/gameserver/dbserver:/go/gameserver/framework:/go/gameserver/roomserver:/go/gameserver/hallserver:/go/gameserver/notifyserver:/go/gameserver/using:/go/gameserver/game/bjl:/go/gameserver/game/ddz:/go/gameserver/game/dzpk:/go/gameserver/game/lhd:/go/gameserver/game/qz21:/go/gameserver/game/qzniuniu:/go/gameserver/game/scmj:/go/gameserver/game/sg:/go/gameserver/game/sgj:/go/gameserver/game/srniuniu:/go/gameserver/game/sss:/go/gameserver/game/tbniuniu:/go/gameserver/game/ttz:/go/gameserver/game/wuzhang:/go/gameserver/game/zjh:/go/gameserver/game/ermj:/go/gameserver/game/brnn:/go/gameserver/game/fkeb:/go/gameserver/game/hhdz:/go/gameserver/game/hhnn:/go/gameserver/game/cd21:/go/gameserver/game/by:/go/gameserver/game/lhj:/go/gameserver/game/tgw:/go/gameserver/tools/newbydbserver
    commands:
      - go test example.invalid/server/pkg/slot -cover
      - go test baijialelogic -cover
      - go test ddzgamelogic -cover
      - go test qznngamelogic_rndz -cover
      - go test sssgamelogic -cover
      - go test ttzlogic -cover
      - go test wzpgamelogic -cover
      - go test dzpklogic -cover
      - go test sggamelogic -cover
      - go test dal/msghandler -cover
      - go test longhudoulogic -cover
      - go test shuiguojilogic -cover
#      - go test qz21gamelogic
      - go test ermjlogic -cover
      - go test srnngamelogic -cover
      - go test tbnngamelogic -cover
      - go test brnnlogic -cover
      - go test hhdzlogic -cover
      - go test hhnnlogic -cover
      - go test bylogic -cover
      - go test zhajinhualogic -cover
      - go test mahjong -cover
      - go test cd21gamelogic -cover
      - go test lhjlogic -cover
      - go test fkeblogic -cover
      - make test-game-tgw
      - make test-game-ald
    when:
      event: [ push, pull_request ] 
      

