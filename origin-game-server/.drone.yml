  docker-release:
    image: plugins/ecr
    access_key: [REDACTED]
    secret_key: [REDACTED]
    registry: "example.invalid"
    repo: "example.invalid/target"
    region: us-east-2
    dockerfile: /go/gameserver/buildtools/gobindockerfile
    default_tags: true
    tags: latest
    when:
      event: [ tag ]
  failure-notify:
    image: diyfr/drone_plugin_teams
    webhook: "https://example.invalid/webhook/1ef22373-712e-43fb-ab7e-f7e1bcd2d4d6@e16cc667-9473-4fc9-9b30-211cdec6647e/JenkinsCI/bf755502cd39488f834cf9dbcb285af9/4a62c4d6-f68a-464f-bf6e-eed5003fccff"
    content:
      title: "版本編譯出錯, 請檢查代碼"
      text: 來自分支 ${DRONE_COMMIT_BRANCH} ${DRONE_COMMIT_MESSAGE} 的 Commit, Author ${DRONE_COMMIT_AUTHOR}
      themeColor: "EA4300"
    when:
      status:  [ failure ]

  build-finish:
    image: golang:latest
    commands:
      - echo "build finish"
  copy-to-release:
    image: target/drone-copy
    srcdir: release/*
    destdir: /mnt/release/
    volumes:
      - /mnt/release:/mnt/release
    when:
      event: [ tag ]
