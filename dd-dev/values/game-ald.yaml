game:
  ald:
    id: 27
    name: 阿拉丁
    group: slot
    room:
      - port: 13111
        serverid: 380
        proto: ald-test
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=27				 	// 游戏ID
            gamename=阿拉丁  		 	 // 游戏名称
            flag=1				     	// 显示名称,客户端可根据此名称将房间分类显示
            minplayer=1              	// 游戏最小人数
            maxplayer=1          		// 游戏最大人数
            tablecount=150			 	// 桌子数
            seatcount=1		    		// 椅子数
            loginmoney=100			 	// 进入游戏最小积分
            scoremode=0					// 0 即时写分 1退房间写分
            maxuser=480					// 最大人数
            taxscale=5					// 抽水比例
            readywaittime=10			// 举手超时时间,单位秒
            reghallserverinterval=5		// 注册广场时间间隔,单位秒
            basescore=100				// 底分
            deallog=2					// 牌局记录器类型0 不记录 ,1 文本, 2 db
            mincarrymoney=20            // 下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1		// 撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=3		// 撮合时间间隔范围大值,单位秒
            againstsameip=0				// 同IP不分配一起
            againstlastgame=0			// 最后一次游戏过的用户不分配一起
            gameendaction=0				// 游戏结束后动作,0 无动作 1 准备
            queuetype=1					// 撮合类型 0 时间随机 1 固定人数
            queueusercount=1			// 排队人数
            queuetimeout=2				// 排队人数超时
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				                            // 结算动画超时
            betcount=10,20,30,50,70,100,200,300,500,700,1000     // 一次下注的数量

            slotpattern=3                                           // 參考csv SlotPattern類型, 可多個用逗號分
            releasepattern=4    // 放分
            bitepattern=5       // 咬分
            bigwinrule=25,75,150,250   								//client動畫播放階段,以Bet為主
            bigwinnotify=25                                        // 當下注16, Total=6400(16*400) 得獎超過6400才廣播.

            [symbols]
            w1.title=百搭
            w1.desc=可代表任何符号，只出现在第2、3、4转轴。\n符号扩展占据整个转轴，并触发免费再转\n免费再转最多触发3次

            [description]
            payline.desc=游戏有10条赔付线，转轴上由最左至右或由最右至左连续出现3个以上的相同符号，即可获得该图标的得分奖励！\n只赔付每条线中赢取最高的奖金。\n游戏出现故障时，所有赔付和游戏都视为无效。
            w1.title=百搭
            w1.desc=可代表任何符号，只出现在第2、3、4转轴。\n符号扩展占据整个转轴，并触发免费再转\n免费再转最多触发3次
