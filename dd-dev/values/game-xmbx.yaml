game:
  xmbx:
    id: 1003
    name: 熊貓報喜
    group: slot
    room:
      - port: 13701
        serverid: 405
        proto: xmbx-test
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=1003				 	// 游戏ID
            gamename=熊貓報喜  		 	// 游戏名称
            flag=1				     	// 显示名称,客户端可根据此名称将房间分类显示
            minplayer=1              	// 游戏最小人数
            maxplayer=1          		// 游戏最大人数
            tablecount=480			 	// 桌子数
            seatcount=1		    		// 椅子数
            loginmoney=0			 	// 进入游戏最小积分
            scoremode=3					// 0 即时写分 1退房间写分
            maxuser=480					// 最大人数
            taxscale=0					// 抽水比例
            readywaittime=10			// 举手超时时间,单位秒
            reghallserverinterval=5		// 注册广场时间间隔,单位秒
            basescore=100				// 底分
            deallog=2					// 牌局记录器类型0 不记录 ,1 文本, 2 db
            mincarrymoney=20            // 下注攜帶金額限制
            settlescore=5000   		//大於SettleScore分時結算
            settleround=3  			//大於SettleRound局時結算

            [gamequeue]
            gamematchwaitmintime=1		// 撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=3		// 撮合时间间隔范围大值,单位秒
            againstsameip=0				// 同IP不分配一起
            againstlastgame=0			// 最后一次游戏过的用户不分配一起
            gameendaction=0				// 游戏结束后动作,0 无动作 1 准备
            queuetype=1					// 撮合类型 0 时间随机 1 固定人数
            queueusercount=1			// 排队人数
            queuetimeout=2				// 排队人数超时
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				                            // 结算动画超时
            betcount=1,2,5,10,20,30,60,100							        // 一次下注的数量

            slotpattern=6                                           // 參考csv SlotPattern類型, 可多個用逗號分
            bigwinrule=20,30,60,120   								//client動畫播放階段,以totalBet為主
            bigwinnotify=25                                         // 當下注16, Total=6400(16*400) 得獎超過6400才廣播.

            [symbols]
            w1.title=百搭
            w1.desc=可代表任何符号，只出现在第2、3、4转轴。\n符号扩展占据整个转轴，并触发免费再转\n免费再转最多触发3次
            s1.title=分散符号
            s1.desc=画面中有3个出现在拉霸的1、3、5直排中，即可获得10场免费游戏，免费游戏中，可再获得10场免费游戏。玩家可多次获得免费游戏。
            g1.title=特殊符号
            g1.desc=转轴出现6个以上的特殊符号时，即触发免费再转特别奖并奖励3次免费再转。

            [description]
            payline.desc=只賠付每條線中贏取最高的獎金獎金派發按照賠付線從最左至最右轉軸的順序遊戲出現故障時，所有賠付和遊戲都視為無效。
