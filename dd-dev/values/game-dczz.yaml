game:
  dczz:
    id: 2003
    name: 赌场战争
    group: poker
    room:
      - port: 43101
        serverid: 420
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2003				    //游戏ID
            gamename=赌场战争A_1		    //游戏名称
            flag=1			     	    //显示名称,客户端可根据此名称将房间分类显示
            minplayer=5                 //游戏最小人数
            maxplayer=3                 //游戏最大人数
            tablecount=100			    //桌子数
            seatcount=3				    //椅子数
            loginmoney=1000			    //进入游戏最小积分
            scoremode=0					//0 即时写分 1退房间写分
            maxuser=500					//最大人数
            taxscale=5					//抽水比例
            readywaittime=6				//举手超时时间,单位秒
            reghallserverinterval=60	//注册广场时间间隔,单位秒
            basescore=10				//底分
            opttime=8					//可操作时间，单位秒
            bet=10,20,30,50,		    //下注分数
            retaction=5					//结算动画超时
            fapaiaction=2				//发牌动画超时
            betaction=2					//下注飞金币动画
            compareaction=3				//比牌动画
            pokertype=1					//1随机发牌 2 发牌器发牌
            maxturn=5					//最多好多轮以后不会弃牌了，自动比牌
            deallog=2					//牌局记录器类型0 不记录 ,1 文本, 2 db
            checkturn=1					//多少轮以后可以看牌
            maxgamecountsametable=0		//同一桌最大游戏次数
            matchmakingtime=6           //未滿遊戲最小人數的等待時間
            matchmakingnumber=1         //開始倒數時間的最低人數
            radomnickname=1             //特殊名稱的開關 0 關閉 1 開啟
            gametimeout=10
            kickoutmoney=0			//達到此积分，強制退出房間
            reversepokerorder=1 //發牌順序是否要改成逆時針 0 順時針 1 逆時針

            [gamequeue]
            gamematchwaitmintime=1		//撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=3		//撮合时间间隔范围大值,单位秒
            againstsameip=1				//同IP不分配一起
            againstlastgame=1			//最后一次游戏过的用户不分配一起
            gameendaction=0				//游戏结束后动作,0 无动作 1 准备
            queuetype=0					//撮合类型 0 时间随机 1 固定人数 2输赢对战
            queueusercount=3			//排队人数
            queuetimeout=3				//排队人数超时
            lessthanuser=10				//低於幾人不採用分桌機制

            [robot]
            enable=1									//是否开启机器人
            logoninterval=30								//加载机器人时间间隔
            minmneyamount=1000							    //机器人最小金币数
            maxmoneyamount=6000						        //机器人最大金币数
            queuecheckwaitspan=3,5							//配桌检查时间间隔
            queueagainwaitspan=3,5							//继续配桌时间间隔
            tablemaxusercount=5								//配桌时桌子上最大人数
            tableminusercount=1								//配桌时桌子上最小人数
            gameendleaveodds=1							    //游戏结束时离开游戏几率
            autositwaitspan=1,3							    //主动入座时间间隔
            gameactionwaitspan=1,2							//游戏动作响应时间间隔
            gamereadywaitspan=1,5							//游戏准备相应时间间隔
            maxusergameendleaveodds=0						//人数达到上限时离开游戏几率
            maxcardsrndlvl=1								//机器人换牌概率0-10
            againstgameing=1                                //進入正在遊戲中的(觀戰) 0是 1否
            matchtablemode=0                                //配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人
            tablematchrobotrate=1,0|2,40|3,33|4,27          //為機器人人數,20機率%.  桌子隨機配N個機器人.分母为固定值,所有数字总和需为100

            Rate_FoldAtWar=5                     // 進入戰爭後棄牌機率
            BetRange_Base=1,7,2                  // 下底注範圍，例如設定1,7,2：1,7為籌碼編號1-7，2為最大的下注次數，系統會隨機決定下注次數
            BetRange_Side=1,7,2                  // 下平手注範圍，例如設定1,7,2：1,7為籌碼編號1-7，2為最大的下注次數，系統會隨機決定下注次數

            [GameSetting]
            Timeout_WaitingStart=5					// 等待遊戲開始 timeout
            Timeout_Betting=10						// 下注 timeout
            Timeout_StopBettingAnimation=5 			// 停止下注動畫 timeout
            Timeout_Shuffle=5                       // 洗牌動畫 timeout
            Timeout_Deal_Normal=5                   // 一般發牌動畫 timeout
            Timeout_Settlement_Normal=10            // 一般結算 timeout
            Timeout_WarSelection=6					// 選擇是否進入戰爭 timeout
            Timeout_WarPhaseBegin=2					// 進入戰爭階段動畫 timeout
            Timeout_Deal_War=5                      // 戰爭發牌動畫 timeout
            Timeout_Settlement_War=10               // 戰爭結算 timeout

            ChipValue=100,1000,5000,10000,50000,100000,500000   // 籌碼面額
            BetLimit_Base=500000                     // 底注額上限
            BetLimit_Side=500000                     // 平手額上限

            [SystemPool]
            EnablePoolControl=1         // 是否開啟水線控制功能，0:關閉，1:開啟
            WinLine=1500000             // 贏錢線
            PersonTimeLimit=20        // 判定人次
          poker.dat: |
            [poker]
            DealType=0              // 發牌方式，0:自然發牌（預設值），1:指定發牌

            Dealer=s1c0       // 莊家手牌
            User1=h1s0        // User1~N 為玩家手牌
            User2=c1d2
            User3=h6c6

            // 系統讀取手牌資料後，只會使用前兩張，第一張用於一般階段發牌，第二張用於戰爭階段發牌
            // 若未指定手牌或張數不足時，則由系統自然發牌

            // 撲克牌代碼說明：
            // 一張撲克牌以兩個字元組成：花色代碼 + 數字代碼
            // 花色代碼：[c]梅花、[d]方塊、[h]紅桃、[s]黑桃、[j]其他，只能用在特殊牌，如大王、小王
            // 數字代碼：[2]~[9]數字1~9、[1]數字1，當作1或A則由server自行判定、[0]數字10、[J]J、[Q]Q、[K]K、[a]小王、[b]大王
            // 範例：[c1]梅花1或梅花A、[h0]紅桃10、[sQ]黑桃Q、[ja]小王
