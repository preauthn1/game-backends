game:
  s5ll:
    id: 1020
    name: s5ll
    group: slot
    room:
      - port: 15401
        serverid: 525
        proto: s5ll-test
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=1020				 	// 游戏ID
            gamename=5LuckyLions                // 游戏名称
            flag=1				     	// 显示名称,客户端可根据此名称将房间分类显示
            minplayer=1              	// 游戏最小人数
            maxplayer=1          		// 游戏最大人数
            tablecount=5			 	// 桌子数
            seatcount=1		    		// 椅子数
            loginmoney=100			 	// 进入游戏最小积分
            scoremode=0					// 0 即时写分 1退房间写分
            maxuser=480					// 最大人数
            taxscale=5					// 抽水比例
            readywaittime=10			// 举手超时时间,单位秒
            reghallserverinterval=5		// 注册广场时间间隔,单位秒
            basescore=100				// 底分
            deallog=0					// 牌局记录器类型0 不记录 ,1 文本, 2 db
            mincarrymoney=50            // 下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1		// 撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=3		// 撮合时间间隔范围大值,单位秒
            againstsameip=0				// 同IP不分配一起
            againstlastgame=0			// 最后一次游戏过的用户不分配一起
            gameendaction=0				// 游戏结束后动作,0 无动作 1 准备
            queuetype=1					// 撮合类型 0 时间随机 1 固定人数
            queueusercount=1			// 排队人数
            queuetimeout=2				// 排队人数超时
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1
            betcount=1,2,5,10,20
            betrate=1

            slotpattern=10007
            bigwinrule=30000,40000,50000,500000
            bigwinnotify=400

            [description]
