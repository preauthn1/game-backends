stages:
  - deploy

deploy:
  image: dtzar/helm-kubectl
  stage: deploy
  tags:
    - node
  environment:
    name: DEV 0.0.0.0
  variables:
    BRANCH: master
  script: 
    - echo $BRANCH
    - git clone -b $BRANCH --single-branch http://gitlab-ci-token:[REDACTED]
    - echo $BUILD_NAME
    - echo $CI_BUILD_TARGETS
    - echo $Message
    - bash servers/scripts/gitlab-ci-deploy-helm.sh dd-dev game-server servers/deployments/game-server . $BUILD_NAME
