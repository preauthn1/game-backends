#繼承用 發送slack通知
.step-send-slack-notify-k8s:
  stage: send-slack-notify-k8s
  tags:
    - dotnet
  only:
    - develop
    - develop_pretest
    - develop_framework
    - master
    - hotfix
    - hotfix_v2026
  script:  
    - var_msg="docker建置完成 已更新至dev <$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID|pipelines/$CI_PIPELINE_ID> ($CI_COMMIT_REF_NAME) ($APP_NAME) \`${CI_COMMIT_SHA:0:8}\` " 
    - curl -H "Content-Type:application/x-www-form-urlencoded" -X POST --data "token=[REDACTED]" "$SLACK_API_URL"    
  
AdminSys Success Slack:
  needs: 
    - job: DEV AdminSys Deploy
      artifacts: false
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: AdminSysAPI  
  
Game Success Slack:
  needs: 
    - job: DEV Game Deploy
      artifacts: false
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: GameAPI  
  
Public Success Slack:
  needs: 
    - job: DEV Public Deploy
      artifacts: false
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: PublicAPI
  
Vendor Success Slack:
  needs: 
    - job: DEV Vendor Deploy
      artifacts: false
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: VendorAPI

ExternalVendor Success Slack:
  needs: 
    - job: DEV ExternalVendor Deploy
      artifacts: false
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: ExternalVendorAPI
  
  

#若中途失敗，發送slack通知
step-send-slack-notify:
  stage: send-slack-notify-when-fail
  tags:
    - dotnet
  script:  
    - var_msg="pipeline 建置失敗 $CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID ($CI_COMMIT_REF_NAME) " 
    - curl -H "Content-Type:application/x-www-form-urlencoded" -X POST --data "token=[REDACTED]" "$SLACK_API_URL"  
  when: on_failure    
  
    
