#觸發k8s部屬
.deploy-to-enviroment:
  stage: deploy-to-enviroment
  image: alpine/helm:3.16.1
  tags:
    - dotnet
  only:
    - develop
    - develop_pretest
    - develop_framework
    - master   
    - hotfix
    - hotfix_v2026
  script:
    - echo "Deploy test start ..."
    - helm upgrade backend-api-${APP_NAME} ./helm-charts/backend-api -f ./helm-charts/backend-api/${DEPLOY_VALUES_FILE} --install --namespace ${DEPLOY_NS} 
      --set image.repository=${APP_IMAGE}
      --set image.tag=${CI_PIPELINE_ID}
      --set service.port=${APP_PORT}
      --set app.name=${APP_NAME}
    - echo "Deploy test completed!"
  

DEV AdminSys Deploy:
  needs:
    - job: AdminSys Build
      artifacts: false
    - job: Test Build
      artifacts: false
    - job: Run Test
      artifacts: false
