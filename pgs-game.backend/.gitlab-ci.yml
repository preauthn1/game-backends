variables:
  SLACK_TOKEN: [REDACTED]"
  SLACK_BOT_NAME: "gitlab_ci_機器人"  
  SLACK_CHANNEL: "backend_jenkins"  
  SLACK_CHANNEL_K8S: "backend_release_k8s"  
  SLACK_API_URL: "https://example.invalid/api/chat.postMessage"  

stages:
  - build
  - test
  - build-docker
  - deploy-to-enviroment
  - send-slack-notify-k8s
  - send-slack-notify-when-fail
  
#確定可以建置成功
Test Build:
  stage: build
  tags:
    - dotnet
  only:
    - develop
    - develop_file_api
    - develop_pretest
    - develop_framework
    - master
    - test_ci_script
    - hotfix
    - hotfix_v2026
    - UAT
    - QA
  image: example.invalid/dotnet/sdk:8.0
  artifacts:
    name: release
    expire_in: 240 min
    paths:
      - release
  script:
    - date
    - dotnet restore target.API.ALL.sln
    - date
    - dotnet build target.API.ALL.sln -c Release --no-restore
    - date
    - mkdir -p ${CI_PROJECT_DIR}/release
    - dotnet publish target.API.AdminSys/target.API.AdminSys.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.AdminSys
    - dotnet publish target.API.Game/target.API.Game.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.Game
    - dotnet publish target.API.Public/target.API.Public.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.Public
    - dotnet publish target.API.Vendor/target.API.Vendor.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.Vendor
    - dotnet publish target.API.ExternalVendor/target.API.ExternalVendor.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.ExternalVendor
    - dotnet publish target.API.Job/target.API.Job.csproj
        -c Release --no-build
        -o ${CI_PROJECT_DIR}/release/target.API.Job
    # - dotnet publish target.API.File/target.API.File.csproj
        # -c Release --no-build
        # -o ${CI_PROJECT_DIR}/release/target.API.File


Run Test:
  stage: test
  tags:
    - dotnet
  image: example.invalid/dotnet/sdk:8.0
  script:     
    #- sed -i 's/MinProtocol = TLSv1.2/MinProtocol = TLSv1/' /etc/ssl/openssl.cnf && sed -i 's/CipherString = DEFAULT@SECLEVEL=2/CipherString = DEFAULT@SECLEVEL=1/' /etc/ssl/openssl.cnf
    #- dotnet test target.Testing/target.Testing.csproj
    - echo 'done'
    

# build docker 共用設定 
.build-docker:
  stage: build-docker
  dependencies:
    - Test Build
  tags:
    - dotnet
  #image: docker:latest
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      command: ["--tls=false", '--mtu=1450']
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  only:
    - develop
    - develop_pretest
    - develop_framework
    - UAT
    - QA
    - hotfix
    - hotfix_v2026
    - master
  before_script:
    - docker info
    - docker login -u "admin" -p "admin123" https://example.invalid
  script:
    - IMG_NAME=$(echo "${APP_NAME}" | tr '[:upper:]' '[:lower:]')
    #- docker pull example.invalid/target/backend/${IMG_NAME}
    - echo ${CI_COMMIT_SHA:0:8}
    - echo ${DOCKER_FILE}
    - docker build -f "${CI_PROJECT_DIR}/DockerFiles/${DOCKER_FILE}" --build-arg APP_NAME=${APP_NAME} --build-arg SHA1=${CI_COMMIT_SHA:0:8} --build-arg PIPE_ID=${CI_PIPELINE_ID} -t example.invalid/target/backend/${IMG_NAME} "${CI_PROJECT_DIR}/release/${APP_NAME}"
    - docker tag example.invalid/target/backend/${IMG_NAME} example.invalid/target/backend/${IMG_NAME}:${CI_PIPELINE_ID}
    - docker push example.invalid/target/backend/${IMG_NAME}
    - docker push example.invalid/target/backend/${IMG_NAME}:${CI_PIPELINE_ID}
  when: manual

#建置成docker_image
AdminSys Build:
  extends: .build-docker
  variables:
