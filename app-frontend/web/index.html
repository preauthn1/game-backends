      left: 50%;

      transform: translate(-50%, -50%);
    }

    .bottom {

      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
