  dbserver:
    build: dbserver/
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./dbserver/config:/approot/dbserver/config
      - ./dbserver/log:/approot/dbserver/log
    network_mode: "host"
    restart: always
    stdin_open: true
    tty: true
