<!doctype html>
<html>
{% block head %} 
<head lang="zh-cmn-Hans">
<meta charset="utf-8">
<!-- 优先使用 IE 最新版本和 Chrome -->
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<!-- 为移动设备添加 viewport -->
<meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
<!-- 添加到主屏后的标题（iOS 6 新增） -->
<meta name="apple-mobile-web-app-title" content="{{title}}">
<!-- 是否启用 WebApp 全屏模式，删除苹果默认的工具栏和菜单栏 -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<!-- 设置苹果工具栏颜色 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<!-- 忽略页面中的数字识别为电话，忽略email识别 -->
<meta name="format-detection" content="telphone=no"/>
<meta name="format-detection" content="email=no"/>
<!-- 启用360浏览器的极速模式(webkit) -->
<meta name="renderer" content="webkit">
<!-- 避免IE使用兼容模式 -->
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<!-- 微软的老式浏览器 -->
<meta name="MobileOptimized" content="320">
<!-- uc强制竖屏 -->
<meta name="screen-orientation" content="portrait">
<!-- QQ强制竖屏 -->
<meta name="x5-orientation" content="portrait">
<!-- UC强制全屏 -->
<meta name="full-screen" content="yes">
<!-- QQ强制全屏 -->
<meta name="x5-fullscreen" content="true">
<!-- UC应用模式 -->
<meta name="browsermode" content="application">
<!-- QQ应用模式 -->
<meta name="x5-page-mode" content="app">
<!-- windows phone 点击无高光 -->
<meta name="msapplication-tap-highlight" content="no">

<!-- 禁止百度移动搜索对网页进行转码 -->
<meta http-equiv="Cache-Control" content="no-transform " />
<title>{% if title %}{{title}}{%else%}会员后台{%endif%}</title>
<meta name="keywords" content="" />
<meta name="description" content="">

<!-- BEGIN GLOBAL MANDATORY STYLES -->
<link href="{{ASSETS_PATH}}/css/bootstrap.min.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/font-awesome.min.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/style-metro.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/style.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/style-responsive.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/uniform.default.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/bootstrap-select.css" rel="stylesheet" type="text/css">
<!-- END GLOBAL MANDATORY STYLES -->

<!-- BEGIN PAGE LEVEL STYLES -->
<link href="{{ASSETS_PATH}}/css/chosen.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/select2_metro.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/DT_bootstrap.css" rel="stylesheet" type="text/css">
<link href="{{ASSETS_PATH}}/css/center.css" rel="stylesheet" type="text/css">

<!-- END PAGE LEVEL STYLES -->
<script src="{{ASSETS_PATH}}/js/WdatePicker.js"></script>
<link href="{{ASSETS_PATH}}/css/WdatePicker.css" rel="stylesheet" type="text/css">
</head>
{% endblock %} 
<body>
{% include 'user/top.html' %}
{% block content %}{% endblock %}
{% include 'user/foot.html' %}
<script src="{{ASSETS_PATH}}/js/layer.js"></script>
<script src="{{ASSETS_PATH}}/js/zx.js?v=20170808"></script>
{% block foot %}{% endblock %}  
</body>
</html>
