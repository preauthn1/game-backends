<div class="bjui-pageContent">
    <form action="{{agentApiRoute}}/pass_opt" data-toggle="ajaxform" class="datagrid-edit-form" data-toggle="validate" data-data-type="jsonp" data-options="{closeCurrent:true,tabid:'sider-menu-4002'}">
        <div class="bjui-row col-1">
            <input type="hidden" name="id" value="{{params.apply.id}}">
            <label class="row-label">代理名称</label>
            <div class="row-input required">
                <input type="text" name="name" class="form-control" value="{{params.apply.name}}" data-rule="required">
            </div>
            <label class="row-label">绑定游戏ID</label>
            <div class="row-input required">
                <input type="Number" name="player_id" class="form-control" value="{{params.apply.player_id}}" data-rule="required">
            </div>
            <label class="row-label">最低代充金额</label>
            <div class="row-input required">
                <input type="Number" name="min_money" class="form-control" value="" data-rule="required">
            </div>
            <label class="row-label">QQ</label>
            <div class="row-input">
                <input type="Number" name="qq" class="form-control" value="{{params.apply.qq}}">
            </div>
            <label class="row-label">微信</label>
            <div class="row-input">
                <input type="text" name="weixin"  class="form-control" value="{{params.apply.weixin}}"  data-rule="required">
            </div>
            <label class="row-label">手机号</label>
            <div class="row-input">
                <input type="Number" name="telphone" class="form-control" value="{{params.apply.telphone}}" data-rule="required;mobile" data-rule-mobile="[/^1[345678]\d{9}$/, '请检查手机号格式']">
            </div>
            <label class="row-label">聊天说明</label>
            <div class="row-input">
                <textarea name="auto_reply" class="form-control">你已通过代理审核，恭喜你的账号正式成为代理账号！</textarea>
            </div>
            <label class="row-label">备注</label>
            <div class="row-input">
                <textarea name="remark" class="form-control"></textarea>
            </div>
            <label class="row-label">快速转账</label>
            <div class="row-input">
                <input type="radio" name="transfer" value="1" data-toggle="icheck" data-label="是">
                <input type="radio" name="transfer" value="0" data-toggle="icheck" data-label="否" checked="">
            </div>
            <label class="row-label">代理广告</label>
            <div class="row-input required">
                <select name="level" class="form-control" data-rule="required" data-width="100%">
                    <option value="1">1级</option>
                    <option value="2">2级</option>
                    <option value="3">3级</option>
                    <option value="4">4级</option>
                    <option value="5">5级无广告</option>
                </select>
            </div>
        </div>
    </form>
</div>
<div class="bjui-pageFooter">
    <ul>
        <li><button type="button" class="btn-close" data-icon="close">取消</button></li>
        <li><button type="submit" class="btn-default" data-icon="save">保存</button></li>
    </ul>
</div>
